<style>
/* Layout: full-screen pedigree canvas — ancestors run right, descendants left — with a top toolbar and a details panel (side on desktop, bottom sheet on phones). */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1c2530; --muted:#5d6b7a; --rule:#d5dce3; --link:#9aa6b2;
  --accent:#2f5d8a; --focus-ring:#2f5d8a;
  --platt:#1f7a72; --lyon:#7a4b86; --johnson:#2f5d8a; --taylor:#a2671c; --ernst:#4d7a2f; --none:#6b7785;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222b; --fg:#e4e9ee; --muted:#97a4b2; --rule:#2e3843; --link:#4a5663;
  --accent:#7fb0e0; --focus-ring:#7fb0e0;
  --platt:#4fb8ad; --lyon:#b88ac4; --johnson:#7fb0e0; --taylor:#e0a557; --ernst:#93c06c; --none:#97a4b2; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --fg:#e4e9ee; --muted:#97a4b2; --rule:#2e3843; --link:#4a5663;
  --accent:#7fb0e0; --focus-ring:#7fb0e0;
  --platt:#4fb8ad; --lyon:#b88ac4; --johnson:#7fb0e0; --taylor:#e0a557; --ernst:#93c06c; --none:#97a4b2; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.2px;white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
.controls label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input[type=search],select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 9px}
input[type=search]{width:min(240px,100%);min-width:0}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.main{position:relative;flex:1;min-height:0;display:flex}
#canvas{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg:active{cursor:grabbing}
.node rect.card{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.node:hover rect.card,.node.sel rect.card{stroke:var(--accent);stroke-width:1.6}
.node.focus rect.card{stroke:var(--accent);stroke-width:2.2}
.node{cursor:pointer}
.node text.nm{font-family:var(--display);font-weight:600;font-size:13.5px;fill:var(--fg)}
.node text.dt{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.node text.ahn{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.node .pg{font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.06em;fill:var(--accent)}
path.ln{fill:none;stroke:var(--link);stroke-width:1.3}
path.sp{fill:none;stroke:var(--link);stroke-width:1.3;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;max-width:300px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.14);font-size:12.5px;line-height:1.45;z-index:5}
.tip b{font-family:var(--display);font-size:15px;display:block}
.tip .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tip p{margin:6px 0 0}
.tip .hint{margin-top:6px;font-size:11px;color:var(--muted)}
aside{width:380px;max-width:100%;border-left:1px solid var(--rule);background:var(--surface);overflow-y:auto;padding-block:18px 28px;padding-inline:20px}
aside h2{font-family:var(--display);font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
aside .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
aside .rel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
aside .rel i{width:9px;height:9px;border-radius:50%}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 6px;font-weight:600}
aside p,aside li{line-height:1.55;max-width:65ch}
aside ul{padding-left:18px;margin:4px 0}
aside li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--rule)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions a,.actions button{font-size:13px;text-decoration:none;color:var(--fg);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;background:var(--bg)}
.actions .primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.close{display:none}
.empty{color:var(--muted);line-height:1.6}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;padding:0;background:var(--surface);font-size:16px}
@media (max-width:760px){
  h1{font-size:18px}
  .legend{display:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  aside.idle{display:none}
  .close{display:block;position:absolute;right:12px;top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>

<script>
const DATA = [{"id": "A1", "ahn": 1, "name": "Matthew Dennis Johnson", "sex": "M", "b": 1971, "dd": null, "living": true, "rel": "Self", "line": "", "f": "A2", "m": "A3", "sp": ["X01", "X02"], "summary": ""}, {"id": "A2", "ahn": 2, "name": "Dennis Ray Johnson", "sex": "M", "b": 1941, "dd": null, "living": true, "rel": "Father", "line": "", "f": "A4", "m": "A5", "sp": ["A3"], "summary": ""}, {"id": "A3", "ahn": 3, "name": "Edith Louise Lyon", "sex": "F", "b": 1948, "dd": null, "living": true, "rel": "Mother", "line": "", "f": "A6", "m": "A7", "sp": ["A2"], "summary": ""}, {"id": "A4", "ahn": 4, "name": "Alfred Edgar Johnson", "sex": "M", "b": 1920, "dd": 2002, "living": false, "rel": "Grandfather", "line": "Johnson", "f": "A8", "m": "A9", "sp": ["A5"], "role": "Matthew's paternal grandfather. Son of Jens Magnus Johansen (Johnson) and Selma Martina Thomsen; husband of Josephine Rhae Taylor.", "facts": ["Born 1920; died 2002.", "World War II: B-17 pilot, 326th Bomb Squadron, 92nd Bomb Group (Heavy), Eighth Air Force, at AAF Station 109 (Podington, England). Officer serial number O-758572.", "Completed his combat tour in January 1945 as a captain.", "Career Air Force officer; a major by 1958, stationed at Geiger Field, Spokane."], "summary": "Alfred joined the 92nd Bomb Group in England as a second lieutenant in June 1944, a week after D-Day, and flew his first mission on 14 June as a co-pilot. Over the next seven months he flew B-17 missions against German airfields, V-weapon launch sites, oil refineries and cities including Berlin, Hamburg, Munich and Leipzig, and in support of the ground fighting in Normandy. He was promoted to captain by October 1944, became his squadron's operations officer, and completed his tour in January 1945. He stayed in the Air Force after the war; in 1958 he was a major at Geiger Field in Spokane, where his brothers Jack and Sid were also stationed.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.m7kz4ia84025", "folder": "https://drive.google.com/drive/folders/1hYofvvqeVVkB35nLrjGwltiL39zUzQO3"}, {"id": "A5", "ahn": 5, "name": "Josephine Rhae Taylor", "sex": "F", "b": 1921, "dd": 1982, "living": false, "rel": "Grandmother", "line": "Taylor", "f": "A10", "m": "A11", "sp": ["A4"], "facts": ["Matthew's paternal grandmother. Daughter of Franklyn Seymour Taylor and Esther Elvira Williams; wife of Alfred Edgar Johnson. FamilySearch ID KCZF-D7Y.", "Born 1921 according to FamilySearch; one Ancestry member tree gives 1922 and Spokane, and Matt's own Ancestry tree also gives 1922. Died 1982.", "Father: Franklyn Seymour Taylor, born in England in 1886.", "Married Alfred Edgar Johnson; their son Dennis Ray Johnson was born in 1941."], "summary": "Josephine was the fifth of 13 children of Franklyn Seymour Taylor, an English-born father, and Esther Elvira Williams. She came from Spokane, in a large family that lost two baby boys in infancy and her older brother Franklyn Jr. in the Pacific in 1942. She married Alfred Edgar Johnson, and their son Dennis was born in 1941; Alfred flew B-17s from England in 1944 and made a career in the Air Force. By 1958 they were living in Spokane again, where a newspaper story about Alfred and his brothers identified her as the former Josephine Taylor of Spokane. She died in 1982.", "notable": ["29 September 1958: a Spokane newspaper story about Alfred and his Air Force brothers names her as the former Josephine Taylor of Spokane. (Confirmed)", "Her older brother Franklyn Seymour Taylor Jr. was killed in action aboard the destroyer USS Preston at Guadalcanal in November 1942.", "Her brothers and sisters, with FamilySearch IDs, are listed on the Taylor Line tab."], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.c1f28khfawtu", "folder": "https://drive.google.com/drive/folders/1Hrtlbys0qpVnTPAebPByjMr-CcS_AwQt"}, {"id": "A6", "ahn": 6, "name": "Ross Edgar Lyon", "sex": "M", "b": 1924, "dd": 1998, "living": false, "rel": "Grandfather", "line": "Lyon", "f": "A12", "m": "A13", "sp": ["A7"], "summary": "Grandfather. Lived many years in and around Salt Lake City with Marjorie (family-reported). Born in 1924, he was of age for World War II service; research on the Lyon line has not started."}, {"id": "A7", "ahn": 7, "name": "Marjorie Anne Platt", "sex": "F", "b": 1925, "dd": 2014, "living": false, "rel": "Grandmother", "line": "Platt", "f": "A14", "m": "A15", "sp": ["A6"], "summary": "Grandmother. Born 2 April 1925 and died 9 February 2014. She married Ross Edgar Lyon, and the couple lived for many years in and around Salt Lake City. Her father died when she was about 13.", "notable": ["Funeral arrangements by Memorial Mortuaries and Cemeteries, a Salt Lake area firm (Confirmed).", "Family-reported: lived many years in the Salt Lake City area with Ross.", "Wanted: her full obituary, wedding date and place, and life story from family."]}, {"id": "A8", "ahn": 8, "name": "Jens Magnus Johansen", "sex": "M", "b": 1888, "dd": 1953, "living": false, "rel": "Great-grandfather", "line": "Johnson", "f": "A16", "m": "A17", "sp": ["A9"], "summary": "Alfred's father. The Johnson line has had only a first search; the name is very common in Scandinavia and the U.S."}, {"id": "A9", "ahn": 9, "name": "Selma Martina Thomsen", "sex": "F", "b": 1892, "dd": 1968, "living": false, "rel": "Great-grandmother", "line": "Johnson", "f": "A18", "m": "A19", "sp": ["A8"]}, {"id": "A10", "ahn": 10, "name": "Franklyn Seymour Taylor", "sex": "M", "b": 1886, "dd": 1959, "living": false, "rel": "Great-grandfather", "line": "Taylor", "f": "A20", "m": "A21", "sp": ["A11"], "role": "Matthew's great-grandfather: Josephine's father. FamilySearch ID KP45-HW6.", "facts": ["Born 1 February 1886, Alresford, Hampshire, England. Died 10 October 1959, Spokane, Washington. (Lead; Ancestry member tree, not yet checked against an original record)", "Matt's Ancestry tree gives his dates as 1884–1960 instead, so his birth and death years need checking against records.", "Mother: Caroline Frances Gambier. Father: not known; the fan chart names Robert Walling, but no record found so far supports that.", "Wife: Esther Elvira Williams (1894–1978), married in Idaho; date not yet found. (Lead; Ancestry member tree, not yet checked against an original record)", "13 children, listed on the Taylor Line tab."], "summary": "Franklyn appears to have been born in Hampshire, England, in 1886, the son of Caroline Frances Gambier, whose family lived in London and Watford. How he came to carry the surname Taylor is not known. He came to America, married Esther Elvira Williams in Idaho, and raised 13 children in Spokane, where he died in 1959. He and Esther lost three sons: two in infancy, and Franklyn Jr., killed in action in 1942.", "notable": ["Emigrated from England to the United States; year, ship and naturalization not yet found.", "Member trees attach him to the 1920, 1930 and 1940 U.S. censuses, which should show his occupation and address. (Lead)"], "military": "None found yet. He was 31 when World War I draft registration began in 1917, so a draft card should exist. A Frank Taylor of Spokane who died in Army service in October 1918 is a different man. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.hvr0x0gh32f6", "folder": "https://drive.google.com/drive/folders/1wkUVjM2SKrYqB8cvfnYoBXTUzBnpTAo-"}, {"id": "A11", "ahn": 11, "name": "Esther Elvira Williams", "sex": "F", "b": 1894, "dd": 1978, "living": false, "rel": "Great-grandmother", "line": "Taylor", "f": "A22", "m": "A23", "sp": ["A10"]}, {"id": "A12", "ahn": 12, "name": "Joseph Valentine Lyon", "sex": "M", "b": 1895, "dd": 1971, "living": false, "rel": "Great-grandfather", "line": "Lyon", "f": "A24", "m": "A25", "sp": ["A13"]}, {"id": "A13", "ahn": 13, "name": "Constance Marie Svendsen", "sex": "F", "b": 1896, "dd": 1980, "living": false, "rel": "Great-grandmother", "line": "Lyon", "f": "A26", "m": "A27", "sp": ["A12"]}, {"id": "A14", "ahn": 14, "name": "Paul Platt", "sex": "M", "b": 1891, "dd": 1938, "living": false, "rel": "Great-grandfather", "line": "Platt", "f": "A28", "m": "A29", "sp": ["A15"], "role": "Matthew's great-grandfather (mother's mother's father).", "facts": ["Born 30 January 1891, Salt Lake City, Utah. Died 14 April 1938, age 47.", "Parents: Franklin Benjamin Platt and Carrie Cornelia Harmon.", "Spouse: Edith Williams. Daughter: Marjorie Anne Platt (1925–2014)."], "summary": "Paul grew up in Salt Lake City in a family active in the city's 13th Ward. At 20 he was called to the Swiss and German Mission, where he served from 1911 until early 1914. He married Edith Williams and their daughter Marjorie was born in 1925. He died in April 1938 at 47, leaving Edith a widow with a young daughter; the cause of death has not yet been found.", "notable": ["Baptized 4 March 1899 at age 8. (Confirmed)", "Set apart 25 July 1911 by Apostle Francis M. Lyman as a missionary to the Swiss and German Mission. (Confirmed)", "Sailed home from Liverpool to Saint John, New Brunswick, on 18 March 1914, age 22, listed as returning from the South German mission. (Confirmed)", "Brothers: Francis Harmon Platt (1886–1962, Netherlands mission), Norton Platt (1892–1981, Eastern States mission), and Edward Orson Platt (1895–1976, Central States mission and Tabernacle Choir). (Confirmed)"], "military": "None found yet. Paul was 26 in June 1917, so he should have registered for the World War I draft on 5 June 1917. Utah's WWI draft registers and militia lists are on FamilySearch (free account required).", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.4d3ltfj6rvpq", "folder": "https://drive.google.com/drive/folders/1p233XatkRrA6_BzyVZGzBExY_C11IYLE"}, {"id": "A15", "ahn": 15, "name": "Edith Williams", "sex": "F", "b": 1894, "dd": 1965, "living": false, "rel": "Great-grandmother", "line": "Platt", "f": "A30", "m": "A31", "sp": ["A14"], "summary": "Great-grandmother. Daughter of David Joseph Williams and Martha Ann John. She married Paul Platt and was widowed in 1938. Public records found so far say little else about her.", "notable": ["Wanted: marriage date, 1940 and 1950 census entries, obituary, and family memories."]}, {"id": "A16", "ahn": 16, "name": "Jorgen Christian Johansen", "sex": "M", "b": 1860, "dd": null, "living": false, "rel": "2nd great-grandfather", "line": "Johnson", "f": "A32", "m": "A33", "sp": ["A17"]}, {"id": "A17", "ahn": 17, "name": "Ane Elisabeth Christiansen", "sex": "F", "b": 1862, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Johnson", "f": "A34", "m": "A35", "sp": ["A16"]}, {"id": "A18", "ahn": 18, "name": "Peter Martin Thomsen", "sex": "M", "b": 1863, "dd": 1926, "living": false, "rel": "2nd great-grandfather", "line": "Johnson", "f": "A36", "m": "A37", "sp": ["A19"]}, {"id": "A19", "ahn": 19, "name": "Hilma Albertine Johannesson", "sex": "F", "b": 1859, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Johnson", "f": "A38", "m": "A39", "sp": ["A18"]}, {"id": "A20", "ahn": 20, "name": "Robert Walling", "sex": "M", "b": null, "dd": null, "living": false, "rel": "2nd great-grandfather", "line": "Taylor", "f": null, "m": null, "sp": ["A21"], "summary": "No supporting record found for Robert Walling as Franklyn Taylor's father"}, {"id": "A21", "ahn": 21, "name": "Caroline Frances Gambier", "sex": "F", "b": 1861, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Taylor", "f": "A42", "m": "A43", "sp": ["A20"], "role": "Matthew's 2nd great-grandmother: mother of Franklyn Seymour Taylor. The fan chart spells her middle name Francis; her mother was Elizabeth Frances.", "facts": ["Born 18 May 1861, Woodford, Essex, England. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: William Gambier and Elizabeth Frances Edwards.", "Sons: Franklyn Seymour Taylor (born 1886, Alresford, Hampshire) and William Saunders (born 1901, Ellisfield, Hampshire). (Lead; Ancestry member tree, not yet checked against an original record)"], "summary": "Caroline was one of about 11 children of William Gambier and Elizabeth Frances Edwards, a family that lived in south London and later Watford. Her son Franklyn was born at Alresford, Hampshire, in 1886; her brother William George Gambier later died in Alresford. One family tree says she married William Saunders and had a second son in 1901, and another names Robert Walling as Franklyn's father. Nothing found so far suggests she left England.", "notable": ["Gambier is a Huguenot (French Protestant refugee) surname, found mainly in France and England. (Confirmed)", "One member tree gives her death as 1930. (Lead)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.8a83b3gvu80a", "folder": "https://drive.google.com/drive/folders/1bYHGFl_qgy2aF554zqPSC-yJn3OvU3CB"}, {"id": "A22", "ahn": 22, "name": "Marion Warden Williams", "sex": "M", "b": 1853, "dd": 1925, "living": false, "rel": "2nd great-grandfather", "line": "Taylor", "f": "A44", "m": "A45", "sp": ["A23"]}, {"id": "A23", "ahn": 23, "name": "Martha Belle Smith", "sex": "F", "b": 1856, "dd": 1938, "living": false, "rel": "2nd great-grandmother", "line": "Taylor", "f": "A46", "m": "A47", "sp": ["A22"]}, {"id": "A24", "ahn": 24, "name": "David Ross Lyon", "sex": "M", "b": 1864, "dd": 1940, "living": false, "rel": "2nd great-grandfather", "line": "Lyon", "f": "A48", "m": "A49", "sp": ["A25"]}, {"id": "A25", "ahn": 25, "name": "Mary Cairns", "sex": "F", "b": 1866, "dd": 1948, "living": false, "rel": "2nd great-grandmother", "line": "Lyon", "f": "A50", "m": "A51", "sp": ["A24"], "summary": "Listed father is Joseph McChess…, but his listed parents are Robert Cairns & Margaret S. Wills — verify parentage"}, {"id": "A26", "ahn": 26, "name": "Johan Svendsen", "sex": "M", "b": 1854, "dd": 1930, "living": false, "rel": "2nd great-grandfather", "line": "Lyon", "f": "A52", "m": "A53", "sp": ["A27"]}, {"id": "A27", "ahn": 27, "name": "Louisa Andreassen", "sex": "F", "b": 1852, "dd": 1943, "living": false, "rel": "2nd great-grandmother", "line": "Lyon", "f": "A54", "m": "A55", "sp": ["A26"]}, {"id": "A28", "ahn": 28, "name": "Franklin Benjamin Platt", "sex": "M", "b": 1856, "dd": 1928, "living": false, "rel": "2nd great-grandfather", "line": "Platt", "f": "A56", "m": "A57", "sp": ["A29"], "role": "Matthew's 2nd great-grandfather (father of Paul Platt).", "facts": ["Born 13 October 1856, Salt Lake City. Died 14 March 1928, Salt Lake City, age 71.", "Parents: Francis Platt Jr. and Eliza Hester, English emigrants.", "Spouse: Carrie Cornelia Harmon, married 11 October 1883."], "summary": "Franklin was born in Salt Lake City four years after his father arrived from England, and lived there all his life. He married Carrie Cornelia Harmon in 1883. He served two church missions, the first to Mississippi in 1885 and the second to California from 1897 to 1899, where Carrie joined him at the end. His 1897 letter accepting the California call was written on the letterhead of the F. Platt Company, a harness and saddlery business on State Street.", "notable": ["Member of the 8th Quorum of Seventy (a church priesthood office). (Confirmed)", "Southern States Mission, Mississippi Conference, 13 October to 24 December 1885. Released early because his father died. (Confirmed)", "California Mission, 22 September 1897 to 11 October 1899; Carrie served with him from 1 September 1899. (Confirmed)", "His 1897 letter to Wilford Woodruff is on F. Platt Co. letterhead: harness and saddlery, 147 to 149 South State Street, Salt Lake City, established 1852. (Confirmed)", "That the F. Platt Company was founded by his father, Francis Platt Jr., who arrived in 1852, is a reasonable guess but not yet documented. (Lead)", "Sons who served missions: Francis Harmon, Paul, Norton and Edward Orson Platt. (Confirmed)"], "military": "None found. He was of militia age during the later years of the Black Hawk War (1865 to 1872); Utah territorial militia records have not been searched.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.ghdudxb53nsh", "folder": "https://drive.google.com/drive/folders/1j0aRoeVALrqkA77240EkPtUzaVAGoo0y"}, {"id": "A29", "ahn": 29, "name": "Carrie Cornelia Harmon", "sex": "F", "b": 1856, "dd": 1948, "living": false, "rel": "2nd great-grandmother", "line": "Platt", "f": "A58", "m": "A59", "sp": ["A28"], "role": "Matthew's 2nd great-grandmother (mother of Paul Platt).", "facts": ["Born 5 March 1856, Pavilion, Genesee County, New York. Died 15 December 1948, Salt Lake City, age 92.", "Parents: Norton Harmon and Thankful Loretta Tanner.", "Spouse: Franklin Benjamin Platt, married 11 October 1883."], "summary": "Carrie was born in western New York and crossed the plains at age 7 with her parents in the 1863 Peter Nebeker Company. She married Franklin Benjamin Platt in Salt Lake City in 1883 and joined him in the California Mission in 1899. She outlived him by 20 years, and Salt Lake newspapers marked both her 91st birthday and her death, when one headline called her a pioneer and church aid worker.", "notable": ["Child pioneer: crossed the plains with the Peter Nebeker Company, 25 July to 25 September 1863. Some sources give 1862. (Confirmed)", "Baptized about 1864; rebaptized 7 June 1883, four months before her marriage. (Confirmed)", "Missionary companion to her husband in the California Mission, September to October 1899. (Confirmed)", "Newspaper items cited by the database: Salt Lake Telegram, 6 March 1947 (91st birthday); Deseret News and Salt Lake Tribune, 16 December 1948 (death and funeral). (Confirmed)"], "military": "Not applicable; none found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.gnienneziazu", "folder": "https://drive.google.com/drive/folders/1An5gRH_-H7PkiSfAG_85OLg4jnH3l_aB"}, {"id": "A30", "ahn": 30, "name": "David Joseph Williams", "sex": "M", "b": 1862, "dd": 1935, "living": false, "rel": "2nd great-grandfather", "line": "Platt", "f": "A60", "m": "A61", "sp": ["A31"], "role": "Matthew's 2nd great-grandfather (father of Edith Williams).", "facts": ["Born 5 May 1862, Canton, Fulton County, Illinois. Died 28 November 1935, Salt Lake City.", "Parents: David Williams and Sarah Thomas, Welsh emigrants.", "Spouse: Martha Ann John, married 30 August 1883 in the Endowment House, Salt Lake City."], "summary": "David Joseph was born in Canton, Illinois, where his Welsh father mined coal. The family moved to Utah in 1877, and by 1880 his father was managing coal mines at Pleasant Valley (Winter Quarters) in Carbon County. David Joseph was living at Pleasant Valley when he married Martha Ann John, daughter of a prominent Provo church leader, in 1883.", "notable": ["Birth, parents, marriage and death dates as above. (Likely)", "Listed as a child of David Williams (1827–1889) on his father's memorial. (Confirmed)", "His father-in-law's journal records the 1883 wedding and calls him David J. Williams of Pleasant Valley. (Confirmed)"], "military": "None found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.mwuqz4v4001q", "folder": "https://drive.google.com/drive/folders/1Ie758ojRJgoPFs4nd_rRUn6VWlrkH1HF"}, {"id": "A31", "ahn": 31, "name": "Martha Ann John", "sex": "F", "b": 1864, "dd": 1927, "living": false, "rel": "2nd great-grandmother", "line": "Platt", "f": "A62", "m": "A63", "sp": ["A30"], "role": "Matthew's 2nd great-grandmother (mother of Edith Williams).", "facts": ["Born 1864, probably in Provo, Utah. Died 1927.", "Parents: David John and Mary Wride, Welsh emigrants.", "Spouse: David Joseph Williams, married 30 August 1883."], "summary": "Martha Ann was one of nine children of David John and Mary Wride, born in Provo three years after her parents arrived from Wales. She married David Joseph Williams of Pleasant Valley in the Endowment House in Salt Lake City in 1883, followed by a reception in Provo. The Provo Territorial Enquirer described her as the daughter of a highly respected Provo resident.", "notable": ["Listed among the children of David John and Mary Wride. (Confirmed)", "Her 1883 wedding is recorded in her father's journal along with the newspaper notice. (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.rp0kzayi9bn", "folder": "https://drive.google.com/drive/folders/118WdZnCPDzMALVQcALWg54A5GsiYDqeU"}, {"id": "A32", "ahn": 32, "name": "Hans Johansen", "sex": "M", "b": 1832, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Johnson", "f": "A64", "m": "A65", "sp": ["A33"]}, {"id": "A33", "ahn": 33, "name": "Karen Sophie Je…", "sex": "F", "b": 1837, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Johnson", "f": null, "m": null, "sp": ["A32"], "summary": "Name truncated on chart"}, {"id": "A34", "ahn": 34, "name": "Christian Andersen", "sex": "M", "b": 1819, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Johnson", "f": null, "m": null, "sp": ["A35"]}, {"id": "A35", "ahn": 35, "name": "Ane Hansen", "sex": "F", "b": 1822, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Johnson", "f": null, "m": null, "sp": ["A34"]}, {"id": "A36", "ahn": 36, "name": "Peder Thomsen", "sex": "M", "b": null, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Johnson", "f": null, "m": null, "sp": ["A37"], "summary": "No dates on chart"}, {"id": "A37", "ahn": 37, "name": "Ane Marie Andersdr", "sex": "F", "b": null, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Johnson", "f": null, "m": null, "sp": ["A36"], "summary": "No dates on chart; 'Andersdr' = Andersdatter"}, {"id": "A38", "ahn": 38, "name": "Johannes Olafsson", "sex": "M", "b": 1821, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Johnson", "f": "A76", "m": "A77", "sp": ["A39"]}, {"id": "A39", "ahn": 39, "name": "Maja Stina Johan…", "sex": "F", "b": 1823, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Johnson", "f": "A78", "m": "A79", "sp": ["A38"], "summary": "Name truncated (likely Johansdotter)"}, {"id": "A42", "ahn": 42, "name": "William Gambier", "sex": "M", "b": 1830, "dd": 1900, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": "A84", "m": "A85", "sp": ["A43"], "role": "Matthew's 3rd great-grandfather: father of Caroline Frances Gambier.", "facts": ["Born 21 March 1830, Brixton, Surrey (now south London). Died October 1900, Watford, Hertfordshire. (Lead; Ancestry member tree, not yet checked against an original record)", "Wife: Elizabeth Frances Edwards. About 11 children, born 1854 to 1876, the first in Camberwell. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: the fan chart lists Thomas Gambier and Sarah Killingback; one member tree gives Thomas Gambier (1783–1848) and Ann Bolton instead."], "summary": "William was born in Brixton, south of London, in 1830, and married Elizabeth Frances Edwards, also from Brixton, around 1853. They raised a large family in the Camberwell area and later Watford, appearing in the English censuses of 1871, 1881 and 1891. He died in Watford in 1900.", "military": "None found. Two of his children were named Thomas Inkerman (1857) and Beatrice Alma (1859), after Crimean War battles of 1854. That could mean he served in the Crimea, or simply reflect patriotic naming at the time. (Lead)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.pfvlpigbzg49", "folder": "https://drive.google.com/drive/folders/1MGAjIR6EBhY6sBUZn6_hQ6KH8r3A3RPc"}, {"id": "A43", "ahn": 43, "name": "Elizabeth Frances Edwards", "sex": "F", "b": 1833, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": "A86", "m": null, "sp": ["A42"], "role": "Matthew's 3rd great-grandmother: mother of Caroline Frances Gambier.", "facts": ["Born 3 February 1832, Brixton, Surrey. Died 30 May 1907, Watford, Hertfordshire. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: William Edwards (born 1802) and Ruth Rosanna Williams (1796–1870). Her father's name matches the fan chart. (Lead; Ancestry member tree, not yet checked against an original record)", "Husband: William Gambier, married about 1853."], "summary": "Elizabeth was born in Brixton in 1832, married William Gambier, and raised about 11 children in south London and Watford. She outlived him by seven years and died in Watford in 1907.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.l1ljsiy0qch4", "folder": "https://drive.google.com/drive/folders/1f6VlnLsKca78jKKg24XjMRb-M6pp6NI-"}, {"id": "A44", "ahn": 44, "name": "David Dora Willi…", "sex": "M", "b": 1823, "dd": 1870, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": null, "m": null, "sp": ["A45"], "summary": "Name truncated (likely Williams); 'Dora' as a middle name is unusual — verify"}, {"id": "A45", "ahn": 45, "name": "Nancy Emaline G…", "sex": "F", "b": 1832, "dd": 1879, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": "A90", "m": "A91", "sp": ["A44"], "summary": "Name truncated; her listed father is surnamed Green"}, {"id": "A46", "ahn": 46, "name": "Peter Nicholas S…", "sex": "M", "b": 1801, "dd": 1870, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": "A92", "m": "A93", "sp": ["A47"], "summary": "Name truncated; likely Smith (father listed as Nicholas Titus Sm…)"}, {"id": "A47", "ahn": 47, "name": "Sarah E. Lauray", "sex": "F", "b": 1818, "dd": 1922, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": null, "m": null, "sp": ["A46"], "summary": "Dates imply age ~104 — verify; also check birth year vs. daughter born 1856"}, {"id": "A48", "ahn": 48, "name": "John Lyon Sr", "sex": "M", "b": 1803, "dd": 1889, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A96", "m": "A97", "sp": ["A49"], "summary": "Would be ~61 at son's 1864 birth — plausible but worth verifying"}, {"id": "A49", "ahn": 49, "name": "Caroline Holland", "sex": "F", "b": 1839, "dd": 1912, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A98", "m": "A99", "sp": ["A48"]}, {"id": "A50", "ahn": 50, "name": "Joseph McChess…", "sex": "M", "b": 1839, "dd": 1895, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A100", "m": "A101", "sp": ["A51"], "summary": "Name truncated; surname doesn't match daughter (Cairns) or his own listed parents (Cairns)"}, {"id": "A51", "ahn": 51, "name": "Janet Edgar John…", "sex": "F", "b": 1842, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A102", "m": "A103", "sp": ["A50"], "summary": "Name truncated (likely Johnstone)"}, {"id": "A52", "ahn": 52, "name": "Sven Andreasson", "sex": "M", "b": 1820, "dd": 1907, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A104", "m": "A105", "sp": ["A53"]}, {"id": "A53", "ahn": 53, "name": "Maja Jonnasson", "sex": "F", "b": 1827, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A106", "m": "A107", "sp": ["A52"]}, {"id": "A54", "ahn": 54, "name": "Andreas Johansen", "sex": "M", "b": 1822, "dd": 1897, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A108", "m": "A109", "sp": ["A55"]}, {"id": "A55", "ahn": 55, "name": "Karen Marie Nilsen", "sex": "F", "b": 1823, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A110", "m": "A111", "sp": ["A54"]}, {"id": "A56", "ahn": 56, "name": "Francis Platt Jr.", "sex": "M", "b": 1824, "dd": 1885, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A112", "m": "A113", "sp": ["A57"], "role": "Matthew's 3rd great-grandfather (grandfather of Paul Platt).", "facts": ["Born 14 March 1824, Darlaston, Staffordshire, England (some records say 1825). Died 14 December 1885, Salt Lake City.", "Parents: Francis Platt and Elizabeth Watson.", "Spouses: Mary Ann White (married 1849, died 1852 on the trail); Eliza Hester (married 19 November 1853)."], "summary": "Francis was born in Darlaston, an industrial town in the Black Country of Staffordshire, and joined the church there in 1850. In 1852 he emigrated with help from the Perpetual Emigrating Fund, the church's loan fund for poor emigrants, and crossed the plains with the Abraham O. Smoot Company. His wife Mary Ann died during the crossing. He remarried in Salt Lake City in 1853 and returned to England as a missionary in 1864. His journals from 1864 to 1868 are held by the Church History Library.", "notable": ["Baptized 20 March 1850 by Thomas Tame. (Confirmed)", "Crossed the plains with the Abraham O. Smoot Company, 1 June to 3 September 1852, with his wife and 2-year-old daughter Mary Elizabeth. Named in the 1852 Deseret News list of emigrants assisted by the Perpetual Emigrating Fund. (Confirmed)", "First wife Mary Ann White died 24 June 1852 during the crossing. (Confirmed)", "British Mission, set apart 22 April 1864 by Franklin D. Richards. (Confirmed)", "Journals, 1864 to 1868, held at the Church History Library as MS 14895. (Likely)", "Son Alonzo Watson Platt (1872–1946) sang bass in the Tabernacle Choir. (Confirmed)"], "military": "None found. Men his age in 1850s and 1860s Salt Lake City were normally enrolled in the territorial militia, but no record naming him has been found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.ozaoi81mlvw8", "folder": "https://drive.google.com/drive/folders/11iM3uo3iycA9msg89Qj4dIeFGcsEp8K-"}, {"id": "A57", "ahn": 57, "name": "Eliza Hester", "sex": "F", "b": 1832, "dd": 1914, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A114", "m": "A115", "sp": ["A56"], "role": "Matthew's 3rd great-grandmother (grandmother of Paul Platt).", "facts": ["Born 6 May 1832, probably England. Died 12 June 1914.", "Parents (from the fan chart): Edward Hester and Elizabeth Walling…", "Spouse: Francis Platt Jr., married 19 November 1853."], "summary": "Eliza crossed the plains with the Jacob Gates Company in 1853, arriving in Salt Lake City in late September. Two months later she married Francis Platt Jr., a widower whose first wife had died on the trail the year before. The family belonged to Salt Lake City's 13th Ward. She outlived Francis by nearly 29 years.", "notable": ["Crossed the plains with the Jacob Gates Company, 3 June to 26 September 1853. (Confirmed)", "Possible voyage: an \"Eliza Esther,\" age 20, from Watford, Hertfordshire, sailed alone on the ship International from Liverpool to New Orleans in February to April 1853. The age and year fit, but the spelling differs. (Lead)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.2srnon9dreai", "folder": "https://drive.google.com/drive/folders/1rijVtK5oCbq0B-7vjtw4hmasBQPu9zix"}, {"id": "A58", "ahn": 58, "name": "Norton Harmon", "sex": "M", "b": 1820, "dd": 1872, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A116", "m": "A117", "sp": ["A59"], "role": "Matthew's 3rd great-grandfather (father of Carrie Cornelia Harmon).", "facts": ["Born 1 August 1820, Stafford, Genesee County, New York. Died 30 January 1872, Kaysville, Utah Territory, age 51.", "Parents (from the fan chart): Adonijah Harmon and Clementina Ama…", "Spouse: Thankful Loretta Tanner, married 4 January 1843."], "summary": "Norton was born in western New York and married Thankful Loretta Tanner in 1843. He was baptized about 1847 by Almon Babbitt, a prominent church agent of that period, but the family stayed in New York for another 16 years. In 1863 they crossed the plains with the Peter Nebeker Company and settled first at Coalville in Summit County. He died at Kaysville in Davis County in 1872.", "notable": ["Baptized about 1847 by Almon Babbitt. (Confirmed)", "Crossed the plains with the Peter Nebeker Company, 25 July to 25 September 1863. (Confirmed)", "The family first settled at Coalville, Summit County, according to a son's obituary. (Likely)", "Not the same person as Oliver Norton Harmon (1826–1901) of Pennsylvania, who sometimes turns up in searches. (Confirmed)"], "military": "None found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.1drp7yopu8vd", "folder": "https://drive.google.com/drive/folders/1W84IcYnxaOU3Fv7qpxMD9WtH4NdR33nU"}, {"id": "A59", "ahn": 59, "name": "Thankful Loretta Tanner", "sex": "F", "b": 1824, "dd": 1891, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A118", "m": "A119", "sp": ["A58"], "role": "Matthew's 3rd great-grandmother (mother of Carrie Cornelia Harmon).", "facts": ["Born 25 April 1824. Died 20 March 1891, Mesa, Arizona.", "Parents (from the fan chart): William Tanner and Hannah Mead.", "Spouse: Norton Harmon, married 4 January 1843."], "summary": "Thankful married Norton Harmon in New York in 1843 and came to Utah with him and their children in 1863, when she was 39. After Norton died in 1872 she moved to Mesa, Arizona, probably with some of her children, who took part in the Latter-day Saint settlement there. She is buried in the Mesa City Cemetery.", "notable": ["Buried in Mesa City Cemetery, Maricopa County, Arizona. (Confirmed)", "Crossed the plains with the Peter Nebeker Company in 1863. (Likely)", "Not from the well-known John Tanner family of early Latter-day Saints; that family's records list no Hannah Mead. (Lead)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.7qjd8wb25k8h", "folder": "https://drive.google.com/drive/folders/1cJykpld09Dec564lJ-Kbs0LfOv_5-TVE"}, {"id": "A60", "ahn": 60, "name": "David Williams", "sex": "M", "b": 1827, "dd": 1889, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A120", "m": "A121", "sp": ["A61"], "role": "Matthew's 3rd great-grandfather (grandfather of Edith Williams).", "facts": ["Born 16 December 1827, Blaenavon, Monmouthshire, Wales. Died 6 December 1889, Price, Utah.", "Parents: David Williams and Sarah Rees.", "Spouses: Sarah Thomas (married 29 May 1847); Mary Ellen Watson Parmley (married 1885, plural marriage). 14 children."], "summary": "David joined the church in Wales in 1847 and emigrated with his wife and three young children in 1854. He settled in Canton, Illinois, where he mined coal, bought coal land, and later led the local church branch. After losing his wealth around 1876 he still paid to move about twenty Canton members to Utah, arriving in 1877. He became contractor and manager of the Denver and Rio Grande Western coal mines at Pleasant Valley, was the area's first bishop, served a mission to Wales from 1885 to 1888, and opened a store in Price shortly before he died.", "notable": ["Sailed on the Clara Wheeler from Liverpool, 27 November 1854, to New Orleans, 12 January 1855, with wife Sarah and children Adneby, Claudia and Dan. Measles killed 23 passengers on the voyage. (Confirmed)", "Coal miner and coal land owner in Canton, Illinois, from 1856; president of the Canton branch of about 50 members. (Confirmed)", "Arrived in Ogden 5 August 1877; ran a small coal business in Salt Lake City; Southern States mission in 1878. (Confirmed)", "From 1880, contractor and manager of the Pleasant Valley coal mines; first bishop of the Pleasant Valley Ward, 1883 to 1885. (Confirmed)", "In 1883, as leaseholder of the Winter Quarters mine, he protested a rival company's reopening of the nearby Utah Mine. (Likely)", "Plural marriage to Mary Ellen Watson Parmley in 1885, during the federal anti-polygamy campaign. No prosecution found. (Confirmed)"], "military": "None found. He was in Illinois during the Civil War, but no service record has turned up.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.rv6zacjtfh9o", "folder": "https://drive.google.com/drive/folders/1IjgiIuD3ZScX8_u0MinkigvKtZcxJQNh"}, {"id": "A61", "ahn": 61, "name": "Sarah Thomas Williams", "sex": "F", "b": 1827, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A122", "m": "A123", "sp": ["A60"], "role": "Matthew's 3rd great-grandmother (grandmother of Edith Williams).", "facts": ["Born 1827, Wales. Died 1905.", "Parents (from the fan chart): Daniel Thomas J… and Sarah Thomas Bo…", "Spouse: David Williams, married 29 May 1847."], "summary": "Sarah married David Williams in Monmouthshire in 1847 and emigrated with him and three small children on the Clara Wheeler in 1854, a voyage on which measles killed 23 people. She lived through the Canton, Illinois years and the move to Utah in 1877. Her husband took a plural wife in 1885, and she outlived him by 16 years.", "notable": ["Listed on the Clara Wheeler passenger list, age 27, 1854. (Confirmed)", "Recorded as Sarah Thomas Williams (1827–1905), wife of David Williams. (Confirmed)", "Not the same person as Sarah Thomas Williams (1834–1909) of Spanish Fork. (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.exscj17c5h6u", "folder": "https://drive.google.com/drive/folders/1s6FbF2RUaSholwsMzRFST_6GFuVdiMlA"}, {"id": "A62", "ahn": 62, "name": "David John", "sex": "M", "b": 1833, "dd": 1908, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A124", "m": "A125", "sp": ["A63"], "role": "Matthew's 3rd great-grandfather (grandfather of Edith Williams).", "facts": ["Born 29 January 1833, Little Newcastle, Pembrokeshire, Wales. Died 24 December 1908, Provo, Utah. Buried Provo City Cemetery.", "Parents: Daniel John and Mary Williams.", "Spouses: Mary Wride (married 8 February 1860, Cardiff); Jane Cree (married 8 October 1865, plural marriage). 20 children."], "summary": "David was raised Baptist and trained for the Baptist ministry before joining the Latter-day Saints in 1856. He served as a missionary in Wales and England, emigrated in 1861, and settled in Provo, where for nearly 50 years he was one of the leading figures in church, school and business life. He was a partner of Abraham O. Smoot, served as Utah Stake president, sat on the board of Brigham Young Academy and BYU, and was imprisoned in 1887 for polygamy. His diaries are considered among the best kept by any Welsh convert.", "notable": ["Baptized 6 February 1856; missionary in Wales, 1856 to 1860, later presiding over the Flintshire Conference and other districts. (Confirmed)", "Sailed on the Manchester from Liverpool, 16 April 1861, arriving New York 14 May; crossed the plains with the Homer Duncan Company, arriving 13 September 1861. (Confirmed)", "His daughter Annie Jane, about 8 months old, died on the trail near Devil's Gate, Wyoming, on 20 August 1861. (Confirmed)", "Second mission to Wales, 1871 to 1873. (Confirmed)", "Church offices: Provo 3rd Ward bishopric counselor from 1862; stake Sunday School superintendent 1865 to 1893; Utah Stake presidency counselor 1877 to 1901; Utah Stake president 1901 to 1908. (Confirmed)", "Ordained a bishop in 1883 and made the Presiding Bishop's agent for Utah County. (Confirmed)"], "military": "None found. Provo men were often called up during the Black Hawk War (1865 to 1872); Utah militia indexes have not been searched.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.876dhx2hmwzp", "folder": "https://drive.google.com/drive/folders/12kdvljUMW9PNZcbNIIWLCuIZI10Fq4Ij"}, {"id": "A63", "ahn": 63, "name": "Mary Wride", "sex": "F", "b": 1831, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A126", "m": "A127", "sp": ["A62"], "role": "Matthew's 3rd great-grandmother (grandmother of Edith Williams).", "facts": ["Born December 1831, Llantrisant, Glamorgan, Wales (sources differ on the day). Died 14 December 1905, Provo, Utah.", "Parents: Danson Wride and Ann Davies.", "Spouse: David John, married 8 February 1860, Cardiff."], "summary": "Mary joined the church in 1857, married David John in Cardiff in 1860, and emigrated with him in 1861. Her baby daughter Annie died on the trail in Wyoming. In Provo she raised nine children and became one of the leading women in Utah County: president of the Utah Stake Relief Society for more than 20 years and an organizer in the Utah County women's suffrage movement.", "notable": ["Censuses place her in Llantrisant (1841), Whitchurch, Glamorgan (1851, 1861), and Provo (1870, 1880, 1900). (Confirmed)", "Emigrated on the Manchester in 1861 and crossed the plains with the Homer Duncan Company; daughter Annie died 20 August 1861. (Confirmed)", "Utah Stake Relief Society president, 1884 to 1905. (Confirmed)", "Active in the Utah County Woman Suffrage Association; Provo agent for the Woman's Exponent newspaper; corresponded with Emmeline B. Wells. (Confirmed)", "Her brother Barry Wride kept a journal of the 1861 voyage. (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.v6na002o4u20", "folder": "https://drive.google.com/drive/folders/1ARnatuRR-1DN2djyzV940ZCbGamAiYOp"}, {"id": "A64", "ahn": 64, "name": "Johan Jorgensen", "sex": "M", "b": null, "dd": null, "living": false, "rel": "4th great-grandfather", "line": "Johnson", "f": null, "m": null, "sp": ["A65"]}, {"id": "A65", "ahn": 65, "name": "Bodil Sorensdatter", "sex": "F", "b": null, "dd": null, "living": f r", "line": "Ernst", "f": "X15", "m": "X16", "sp": ["X08", "X24"], "role": "Grandfather of Madison, Conner and Seth Johnson; father of Stephanie Ernst. German name: Günter Heinrich Georg Ernst.", "facts": ["Born 18 July 1936 at home, Annenstraße 1, Hannover, Germany. Died 17 June 2023 at home in Washington, Utah, age 86. (Confirmed; obituary and Günter's 2005 letter)", "Parents: Friedrich Ernst and Hedwig Hermine Heimann. Sister: Gertrud Helene Ernst (1929–living).", "Arrived in Salt Lake City on 19 December 1955; U.S. citizen in 1961. (Confirmed; obituary)"], "summary": "Günter was born in Hannover in 1936, the only son of Friedrich and Hedwig Ernst, who were in their forties when he was born. He was baptized Lutheran and grew up during the Allied bombing of Hannover, which repeatedly closed his schools. He joined The Church of Jesus Christ of Latter-day Saints in Germany in 1954 and emigrated to Salt Lake City the following year. He served nearly four years in the U.S. Army, became a citizen in 1961, and spent 39 years with EIMCO Corporation's Filter Division, working his way into supervisor and management positions. In 2005 he wrote a letter about his life, addressed \"to those who care,\" for his descendants. He died at his home in Washington, Utah, in 2023 and was buried with his wife Sheila in Riverton Cemetery.", "military": "U.S. Army, June 1957 to March 1961: 45 months in the artillery. He enlisted with a guarantee of service in Germany. (Confirmed) Stations: Fort Ord (California), Fort Sill (Oklahoma) and Fort Dix (New Jersey); then in Germany with the 23rd AA Battalion at Nellingen near Stuttgart and the 210th Artillery Group headquarters at Ansbach. Honorably discharged at Fort Hamilton, New York, in March 1961. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.kmuland2n1kn", "folder": "https://drive.google.com/drive/folders/15xVEUpijUG0wGSuHbu4LLn7awom7V0dD"}, {"id": "X08", "ahn": null, "nam 023), born in Hannover."], "summary": "Friedrich was born in Northeim in 1888. In 1929 he and Hedwig were living in Danzig (now Gdańsk, Poland), where their daughter Gertrud was born, and by 1936 they had settled in Hannover, where their son Günter was born when both parents were in their forties. The family was Lutheran and lived through the bombing of Hannover in the Second World War. After Hedwig died in 1968 Friedrich remarried. He died in Hannover in 1980; his second wife did not tell Günter of his death until four weeks later.", "military": "None found yet. Born in 1888, he was of age for German service in World War I. The free German casualty lists for 1914 to 1919 (des.genealogy.net) list wounded and missing soldiers with their home towns.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.v9jrql4ky2j4", "folder": "https://drive.google.com/drive/folders/1KQnAGrU0NdvWRNcrqqm_M7MlhEkFx0vR"}, {"id": "X16", "ahn": null, "name": "Hedwig Hermine Heimann", "sex": "F", "b": 1893, "dd": 1968, "living": false, "rel": "Stephanie's grandmother", "line": "Ernst", "f": "X17", "m": "X18", "sp": ["X15"], "role": "Great-grandmother of Madison, Conner and Seth Johnson; Günter's mother.", "facts": ["Born 30 July 1893 on her parents' farm at Bukowitz, West Prussia, near Goßlershausen. Bukowitz is now Bukowiec, near Jabłonowo Pomorskie, Poland. (Family document: Günter's 2005 letter) Place identification: Likely; Meyers Gazetteer.", "Died February 1968 of pneumonia. (Family document: Günter's 2005 letter)", "Parents: August Heimann and Auguste Heymann. She was the oldest of six children; one brother died young. (Family document: Günter's 2005 letter)", "Husband: Friedrich Ernst."], "summary": "Hedwig grew up on her family's farm in Bukowitz, a village of about 670 people in Kreis Strasburg, West Prussia, an area that became part of Poland after 1920. She married Friedrich Ernst; their daughter Gertrud was born in Danzig in 1929 and their son Günter in Hannover in 1936. She had severe asthma for most of her life, and Günter remembered sitting up with her through the night during attacks. During the raids on Hannover she took her children to the shelters. In 1945 her mother and other relatives fled the advancing Soviet army by horse-drawn wagon, heading for Hannover to seek help from her family. She died of pneumonia in 1968.", "notable": ["Bukowitz in Kreis Strasburg had its own civil registry office. Today it is Bukowiec, about 5 km from Jabłonowo Pomorskie in the Kuyavian-Pomeranian region of Poland, with 263 residents in 2021. (Confirmed)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.g2e1cwrruxl5", "folder": "https://drive.google.com/drive/folders/1JprQInbTa5UskQavUQvATlmnkP5mPNLZ"}, {"id": "X17", "ahn": null, "name": "August Heimann", "sex": "M", "b": 1866, "dd": 1923, "living": false, "rel": "Stephanie's great-grandfather", "line": "Ernst", "f": null, "m": null, "sp": ["X18"], "role": "2nd great-grandfather of Madison, Conner and Seth Johnson; Hedwig's father.", "facts": ["Owned and worked a farm at Bukowitz, West Prussia (now Bukowiec, Poland), with his wife. (Family document: Günter's 2005 letter)", "Died of asthma at about age 55, according to his grandson Günter; the family tree gives 1866–1923, which would make him about 56. (Family document: Günter's 2005 letter)", "Wife: Auguste Heymann. Six children, the oldest being Hedwig (born 1893); one son died young."], "summary": "August Heimann farmed at Bukowitz in West Prussia, where he and Auguste raised six children. He died in 1923, a few years after the area became part of Poland. His daughter Hedwig also suffered from severe asthma throughout her life.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.546es7tvpxoq", "folder": "https://drive.google.com/drive/folders/1L0hrAf6HLx3SGJ3WboF77MLb946JXcen"}, {"id": "X18", "ahn": null, "name": "Auguste Heymann", "sex": "F", "b": 1871, "dd": 1945, "living": false, "rel": "Stephanie's great-grandmother", "line": "Ernst", "f": null, "m": null, "sp": ["X17"], "role": "2nd great-grandmother of Madison, Conner and Seth Johnson; Hedwig's mother. The tree spells her surname Heymann and her husband's Heimann.", "facts": ["Born 1871; killed in mid-1945 at the family farm in Bukowitz. (Ancestry tree; family document)", "Husband: August Heimann. Six children, including Hedwig."], "summary": "Auguste farmed at Bukowitz with her husband August, who died in 1923. As the Soviet army advanced through the region in early 1945, the family loaded their belongings onto horse-drawn wagons and set out west toward Hannover to seek help from her daughter Hedwig. During the trek Auguste and one of her grandsons became separated from the others, and she went back to the farm. There, according to the Polish family who later lived on the farm, the boy found a hand grenade and pulled the pin while playing with it. Auguste took the grenade from him and threw herself on it to shield him, and she was killed instantly. Günter recorded her age as about 80; the family tree's dates would make her about 74.", "notable": ["Gave her life to save her grandson in 1945. (Family document) Günter's account came from the Polish residents who later lived on the farm.", "The Red Army took the Goßlershausen area in spring 1945. (Confirmed)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.di3fdhv58ncu", "folder": "https://drive.google.com/drive/folders/1sVk_Ve4sLylonFw2a76i6RO1IqG2A_-G"}, {"id": "X19", "ahn": null, "name": "Bruno W. H. Kutz", "sex": "M", "b": 1904, "dd": 1979, "living": false, "rel": "Stephanie's grandfather", "line": "Ernst", "f": "X21", "m": "X22", "sp": ["X20"]}, {"id": "X20", "ahn": null, "name": "Maria M. Gibat", "sex": "F", "b": 1905, "dd": null, "living": false, "rel": "Stephanie's grandmother", "line": "Ernst", "f":   d3.tree().nodeSize([ROW, COL]).separation(() => 1)(des);
  des.each(n => { if (n.depth) nodes.push({id: n.data.id, x: -n.y, y: n.x}); });
  des.links().forEach(l => links.push({s: [-l.source.y, l.source.x], t: [-l.target.y, l.target.x], k: "ln"}));
  // focus and spouses in column 0
  nodes.push({id: fid, x: 0, y: 0, focus: true});
  const sp = (P[fid].sp || []).filter(s => P[s]);
  sp.forEach((s, i) => {
    const y = (i % 2 === 0 ? 1 : -1) * ROW * 1.25 * (Math.floor(i / 2) + 1);
    // avoid stacking onto the ancestor column: spouses stay at x=0, which only the focus occupies
    nodes.push({id: s, x: 0, y, spouse: true});
    links.push({s: [0, 0], t: [0, y], k: "sp"});
  });
  return {nodes, links};
}
function elbow(l) {
  const [sx, sy] = l.s, [tx, ty] = l.t;
  if (l.k === "sp") return `M${sx},${sy + Math.sign(ty) * H/2}V${ty - Math.sign(ty) * H/2}`;
  const dir = Math.sign(tx - sx), x0 = sx + dir * W/2, x1 = tx - dir * W/2, mx = (x0 + x1) / 2;
  return `M${x0},${sy}H${mx}V${ty}H${x1}`;
}
function render(fit = true) {
  const gens = +document.getElementById("gens").value;
  const {nodes, links} = layout(focusId, gens);
  vp.selectAll("*").remove();
  vp.append("g").selectAll("path").data(links).join("path").attr("class", d => d.k).attr("d", elbow);
  const g = vp.append("g").selectAll("g").data(nodes, d => d.id).join("g")
    .attr("class", d => "node" + (d.focus ? " focus" : "") + (d.id === selId ? " sel" : ""))
    .attr("transform", d => `translate(${d.x - W/2},${d.y - H/2})`)
    .attr("tabindex", 0).attr("role", "button")
    .attr("aria-label", d => `${P[d.id].name}, ${dates(P[d.id])}`);
  g.append("rect").attr("class", "card").attr("width", W).attr("height", H).attr("rx", 7);
  g.append("circle").attr("cx", 14).attr("cy", 18).attr("r", 4.5).attr("fill", d => lc(P[d.id]));
  g.append("text").attr("class", "nm").attr("x", 25).attr("y", 22).text(d => trunc(P[d.id].name, P[d.id].tab ? 19 : 24));
  g.append("text").attr("class", "dt").attr("x", 25).attr("y", 40).text(d => dates(P[d.id]));
  g.filter(d => P[d.id].ahn).append("text").attr("class", "ahn").attr("x", W - 9).attr("y", 40).attr("text-anchor", "end").text(d => "No. " + P[d.id].ahn);
  g.filter(d => P[d.id].tab).append("text").attr("class", "pg").attr("x", W - 9).attr("y", 16).attr("text-anchor", "end").text("PAGE");
  g.on("pointerenter", (e, d) => { if (e.pointerType === "mouse") showTip(e, d.id); })
   .on("pointermove", (e) => { if (e.pointerType === "mouse") moveTip(e); })
   .on("pointerleave", hideTip)
   .on("click", (e, d) => { hideTip(); select(d.id); })
   .on("dblclick", (e, d) => { e.stopPropagation(); setFocus(d.id); })
   .on("keydown", (e, d) => { if (e.key === "Enter") { e.shiftKey ? setFocus(d.id) : select(d.id); } });
  if (fit) fitView();
}
function fitView() {
  const box = vp.node().getBBox(), el = svg.node().getBoundingClientRect();
  if (!box.width) return;
  const k = Math.min(1.1, 0.92 * Math.min(el.width / box.width, el.height / box.height));
  const t = d3.zoomIdentity.translate(el.width/2 - k*(box.x + box.width/2), el.height/2 - k*(box.y + box.height/2)).scale(k);
  svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450).call(zoom.transform, t);
}
const tip = document.getElementById("tip");
function showTip(e, id) {
  const p = P[id];
  const body = p.living ? "Living. Details are kept private." : (trunc(p.summary || p.role || "", 260) || "No summary yet. Family members can add what they know.");
  tip.innerHTML = `<b>${esc(p.name)}</b><span class="d">${esc(dates(p))}${p.rel ? " · " + esc(p.rel) : ""}</span><p>${esc(body)}</p><div class="hint">Click for details · double-click to center</div>`;
  tip.hidden = false; moveTip(e);
}
function moveTip(e) {
  const r = document.getElementById("canvas").getBoundingClientRect();
  let x = e.clientX - r.left + 16, y = e.clientY - r.top + 14;
  if (x + 310 > r.width) x = e.clientX - r.left - 316;
  if (y + tip.offsetHeight > r.height) y = Math.max(8, r.height - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }

const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
function chip(id) { const p = P[id]; return `<button class="chip" type="button" data-id="${id}">${esc(p.name)} <span class="d">${esc(dates(p))}</span></button>`; }
function relList(title, ids) { ids = ids.filter(x => x && P[x]); return ids.length ? `<h3>${title}</h3><div class="chips">${ids.map(chip).join("")}</div>` : ""; }
function select(id) {
  selId = id; const p = P[id];
  vp.selectAll(".node").classed("sel", d => d.id === id);
  const sibs = DATA.filter(q => q.id !== id && ((p.f && q.f === p.f) || (p.m && q.m === p.m))).sort((a,b)=>(a.b||9999)-(b.b||9999)).map(q => q.id);
  let h = `<h2>${esc(p.name)}</h2><div class="d">${esc(dates(p))}${p.ahn ? " · Ahnentafel no. " + p.ahn : ""}</div>`;
  if (p.rel) h += `<div class="rel"><i style="background:${lc(p)}"></i>${esc(p.rel)}${p.line ? " · " + esc(p.line) + " line" : ""}</div>`;
  if (p.living) {
    h += `<p class="empty">Living. Only the name and birth year are shown here.</p>`;
  } else {
    if (p.role) h += `<p>${esc(p.role)}</p>`;
    if (p.facts && p.facts.length) h += `<ul>${p.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
    if (p.summary) h += `<h3>Life summary</h3><p>${esc(p.summary)}</p>`;
    if (p.military) h += `<h3>Military service</h3><p>${esc(p.military)}</p>`;
    if (p.notable && p.notable.length) h += `<h3>Notable</h3><ul>${p.notable.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
    if (!p.summary && !p.role && !(p.facts||[]).length) h += `<p class="empty">Nothing researched yet. If you know something about ${esc(p.name.split(" ")[0])}, tell Matt or add it to the family history document.</p>`;
  }
  h += `<div class="actions">${id !== focusId ? `<button class="primary" type="button" data-focus="${id}">Center tree here</button>` : ""}`;
  if (p.tab) h += `<a href="${p.tab}" target="_blank" rel="noopener">Full page in family doc</a>`;
  if (p.folder) h += `<a href="${p.folder}" target="_blank" rel="noopener">Photos and documents</a>`;
  h += `</div>`;
  h += relList("Parents", [p.f, p.m]) + relList(p.sp.length > 1 ? "Spouses" : "Spouse", p.sp) + relList("Children", kids[id] || []) + relList("Siblings", sibs);
  if (p.tab || p.folder) h += `<p class="note">The family doc and photo folders open only for relatives they have been shared with.</p>`;
  pbody.innerHTML = h; panel.classList.remove("idle"); panel.scrollTop = 0;
}
pbody.addEventListener("click", e => {
  const c = e.target.closest("[data-id]"), f = e.target.closest("[data-focus]");
  if (f) setFocus(f.dataset.focus);
  else if (c) setFocus(c.dataset.id);
});
document.getElementById("pclose").onclick = () => panel.classList.add("idle");
function setFocus(id) {
  focusId = id; try { history.replaceState(null, "", "#" + id); } catch(e) {}
  render(); select(id);
}
document.getElementById("gens").onchange = () => render();
document.getElementById("home").onclick = () => setFocus("A1");
document.getElementById("q").addEventListener("change", e => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const hit = DATA.find(p => `${p.name} (${dates(p)})`.toLowerCase() === v) || DATA.find(p => p.name.toLowerCase().includes(v.replace(/\s*\(.*$/, "")));
  if (hit) { setFocus(hit.id); e.target.value = ""; e.target.blur(); }
});
document.getElementById("zin").onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById("zout").onclick = () => svg.transition().call(zoom.scaleBy, 1/1.3);
document.getElementById("zfit").onclick = fitView;
window.addEventListener("resize", () => fitView());
render(); select(focusId);
if (matchMedia("(max-width:760px)").matches) panel.classList.add("idle");
</script>

</body>
