tuttgart and the 210th Artillery Group headquarters at Ansbach. Honorably discharged at Fort Hamilton, New York, in March 1961. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.kmuland2n1kn", "folder": "https://drive.google.com/drive/folders/15xVEUpijUG0wGSuHbu4LLn7awom7V0dD", "svc": [{"w": "cold", "s": "confirmed", "n": "U.S. Army artillery, 1957–61, including service in Germany."}, {"w": "vietnam", "s": "possible", "n": "Aged 28–37 during the war; no record found yet."}, {"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Germany in 1954; emigrated to Salt Lake City in 1955."}]}, {"id": "X08", "ahn": null, "name": "Dagmar E. Kutz", "sex": "F", "b": 1938, "dd": null, "living": true, "rel": "Stephanie's mother", "line": "Ernst", "f": "X19", "m": "X20", "sp": ["X07"], "summary": ""}, {"id": "X09", "ahn": null, "name": "Suzanne Ernst", "sex": "F", "b": 1961, "dd": null, "living": true, "rel": "Stephanie's sister", "line": "Ernst", "f": "X07", "m": "X08", "sp": ["X10"], "summary": ""}, {"id": "X10", "ahn": null, "name": "Martin A. Waldhouse", "sex": "M", "b": null, "dd": null, "living": true, "rel": "Suzanne's spouse", "line": "", "f": null, "m": null, "sp": ["X09"], "summary": ""}, {"id": "X11", "ahn": null, "name": "Roland M. Ernst", "sex": "M", "b": 1962, "dd": null, "living": true, "rel": "Stephanie's brother", "line": "Ernst", "f": "X07", "m": "X08", "sp": ["X12"], "summary": ""}, {"id": "X12", "ahn": null, "name": "Janetta Schneide…", "sex": "F", "b": null, "dd": null, "living": true, "rel": "Roland's spouse", "line": "", "f": null, "m": null, "sp": ["X11"], "summary": ""}, {"id": "X13", "ahn": null, "name": "Anthony Ernst", "sex": "M", "b": 1970, "dd": null, "living": true, "rel": "Stephanie's brother", "line": "Ernst", "f": "X07", "m": "X08", "sp": [], "summary": ""}, {"id": "X14", "ahn": null, "name": "Gertrud Helene Ernst", "sex": "F", "b": 1929, "dd": null, "living": true, "rel": "Guenter's sister", "line": "Ernst", "f": "X15", "m": "X16", "sp": [], "summary": ""}, {"id": "X15", "ahn": null, "name": "Friedrich Ernst", "sex": "M", "b": 1888, "dd": 1980, "living": false, "rel": "Stephanie's grandfather", "line": "Ernst", "f": null, "m": null, "sp": ["X16"], "role": "Great-grandfather of Madison, Conner and Seth Johnson; Günter's father.", "facts": ["Born 4 April 1888 in Northeim, near Göttingen, Lower Saxony, Germany. (Family document: Günter's 2005 letter)", "Died February 1980 at the Siloah Hospital, Hannover-Ricklingen. (Family document: Günter's 2005 letter)", "Wife: Hedwig Hermine Heimann. Children: Gertrud Helene (1929–living), born in Danzig, and Günter (1936–2023), born in Hannover."], "summary": "Friedrich was born in Northeim in 1888. In 1929 he and Hedwig were living in Danzig (now Gdańsk, Poland), where their daughter Gertrud was born, and by 1936 they had settled in Hannover, where their son Günter was born when both parents were in their forties. The family was Lutheran and lived through the bombing of Hannover in the Second World War. After Hedwig died in 1968 Friedrich remarried. He died in Hannover in 1980; his second wife did not tell Günter of his death until four weeks later.", "military": "None found yet. Born in 1888, he was of age for German service in World War I. The free German casualty lists for 1914 to 1919 (des.genealogy.net) list wounded and missing soldiers with their home towns.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.v9jrql4ky2j4", "folder": "https://drive.google.com/drive/folders/1KQnAGrU0NdvWRNcrqqm_M7MlhEkFx0vR", "svc": [{"w": "ww1de", "s": "possible", "n": "Aged 26–30 during the war; no record found yet."}]}, {"id": "X16", "ahn": null, "name": "Hedwig Hermine Heimann", "sex": "F", "b": 1893, "dd": 1968, "living": false, "rel": "Stephanie's grandmother", "line": "Ernst", "f": "X17", "m": "X18", "sp": ["X15"], "role": "Great-grandmother of Madison, Conner and Seth Johnson; Günter's mother.", "facts": ["Born 30 July 1893 on her parents' farm at Bukowitz, West Prussia, near Goßlershausen. Bukowitz is now Bukowiec, near Jabłonowo Pomorskie, Poland. (Family document: Günter's 2005 letter) Place identification: Likely; Meyers Gazetteer.", "Died February 1968 of pneumonia. (Family document: Günter's 2005 letter)", "Parents: August Heimann and Auguste Heymann. She was the oldest of six children; one brother died young. (Family document: Günter's 2005 letter)", "Husband: Friedrich Ernst."], "summary": "Hedwig grew up on her family's farm in Bukowitz, a village of about 670 people in Kreis Strasburg, West Prussia, an area that became part of Poland after 1920. She married Friedrich Ernst; their daughter Gertrud was born in Danzig in 1929 and their son Günter in Hannover in 1936. She had severe asthma for most of her life, and Günter remembered sitting up with her through the night during attacks. During the raids on Hannover she took her children to the shelters. In 1945 her mother and other relatives fled the advancing Soviet army by horse-drawn wagon, heading for Hannover to seek help from her family. She died of pneumonia in 1968.", "notable": ["Bukowitz in Kreis Strasburg had its own civil registry office. Today it is Bukowiec, about 5 km from Jabłonowo Pomorskie in the Kuyavian-Pomeranian region of Poland, with 263 residents in 2021. (Confirmed)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.g2e1cwrruxl5", "folder": "https://drive.google.com/drive/folders/1JprQInbTa5UskQavUQvATlmnkP5mPNLZ"}, {"id": "X17", "ahn": null, "name": "August Heimann", "sex": "M", "b": 1866, "dd": 1923, "living": false, "rel": "Stephanie's great-grandfather", "line": "Ernst", "f": null, "m": null, "sp": ["X18"], "role": "2nd great-grandfather of Madison, Conner and Seth Johnson; Hedwig's father.", "facts": ["Owned and worked a farm at Bukowitz, West Prussia (now Bukowiec, Poland), with his wife. (Family document: Günter's 2005 letter)", "Died of asthma at about age 55, according to his grandson Günter; the family tree gives 1866–1923, which would make him about 56. (Family document: Günter's 2005 letter)", "Wife: Auguste Heymann. Six children, the oldest being Hedwig (born 1893); one son died young."], "summary": "August Heimann farmed at Bukowitz in West Prussia, where he and Auguste raised six children. He died in 1923, a few years after the area became part of Poland. His daughter Hedwig also suffered from severe asthma throughout her life.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.546es7tvpxoq", "folder": "https://drive.google.com/drive/folders/1L0hrAf6HLx3SGJ3WboF77MLb946JXcen"}, {"id": "X18", "ahn": null, "name": "Auguste Heymann", "sex": "F", "b": 1871, "dd": 1945, "living": false, "rel": "Stephanie's great-grandmother", "line": "Ernst", "f": null, "m": null, "sp": ["X17"], "role": "2nd great-grandmother of Madison, Conner and Seth Johnson; Hedwig's mother. The tree spells her surname Heymann and her husband's Heimann.", "facts": ["Born 1871; killed in mid-1945 at the family farm in Bukowitz. (Ancestry tree; family document)", "Husband: August Heimann. Six children, including Hedwig."], "summary": "Auguste farmed at Bukowitz with her husband August, who died in 1923. As the Soviet army advanced through the region in early 1945, the family loaded their belongings onto horse-drawn wagons and set out west toward Hannover to seek help from her daughter Hedwig. During the trek Auguste and one of her grandsons became separated from the others, and she went back to the farm. There, according to the Polish family who later lived on the farm, the boy found a hand grenade and pulled the pin while playing with it. Auguste took the grenade from him and threw herself on it to shield him, and she was killed instantly. Günter recorded her age as about 80; the family tree's dates would make her about 74.", "notable": ["Gave her life to save her grandson in 1945. (Family document) Günter's account came from the Polish residents who later lived on the farm.", "The Red Army took the Goßlershausen area in spring 1945. (Confirmed)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.di3fdhv58ncu", "folder": "https://drive.google.com/drive/folders/1sVk_Ve4sLylonFw2a76i6RO1IqG2A_-G"}, {"id": "X19", "ahn": null, "name": "Bruno W. H. Kutz", "sex": "M", "b": 1904, "dd": 1979, "living": false, "rel": "Stephanie's grandfather", "line": "Ernst", "f": "X21", "m": "X22", "sp": ["X20"], "svc": [{"w": "ww2de", "s": "possible", "n": "Aged 35–41 during the war; no record found yet."}]}, {"id": "X20", "ahn": null, "name": "Maria M. Gibat", "sex": "F", "b": 1905, "dd": null, "living": false, "rel": "Stephanie's grandmother", "line": "Ernst", "f": "X23", "m": null, "sp": ["X19"], "summary": "Death date unknown"}, {"id": "X21", "ahn": null, "name": "Karl Kutz", "sex": "M", "b": null, "dd": 1940, "living": false, "rel": "Stephanie's great-grandfather", "line": "Ernst", "f": null, "m": null, "sp": ["X22"]}, {"id": "X22", "ahn": null, "name": "Salome Dulz", "sex": "F", "b": 1879, "dd": 1951, "living": false, "rel": "Stephanie's great-grandmother", "line": "Ernst", "f": null, "m": null, "sp": ["X21"]}, {"id": "X23", "ahn": null, "name": "Gibat (first name unknown)", "sex": "M", "b": null, "dd": null, "living": false, "rel": "Stephanie's great-grandfather", "line": "Ernst", "f": null, "m": null, "sp": [], "summary": "Father of Maria M. Gibat"}, {"id": "X30", "ahn": null, "name": "Marguerite Ruth Taylor", "sex": "F", "b": 1914, "dd": 2000, "living": false, "rel": "Great-aunt", "line": "Taylor", "f": "A10", "m": "A11", "sp": []}, {"id": "X31", "ahn": null, "name": "Franklyn Seymour Taylor Jr.", "sex": "M", "b": 1916, "dd": 1942, "living": false, "rel": "Great-uncle", "line": "Taylor", "f": "A10", "m": "A11", "sp": [], "role": "Older brother of Josephine Rhae Taylor, Dennis's mother. FamilySearch ID L7G5-KDW.", "facts": ["Born 1916. Killed in action in November 1942, Naval Battle of Guadalcanal, Solomon Islands.", "Parents: Franklyn Seymour Taylor (1886–1959) and Esther Elvira Williams (1894–1978).", "Service: U.S. Navy, destroyer USS Preston (DD-379)."], "summary": "Franklyn Jr. was the second of 13 children and the oldest son of Franklyn Seymour Taylor and Esther Elvira Williams. He served in the U.S. Navy and by late 1942 held the rate of Chief Machinist's Mate, a senior enlisted rate in a ship's engineering department, aboard the destroyer USS Preston. He was killed when Preston was sunk during the Naval Battle of Guadalcanal, about 26 years old.", "military": "Navy casualty record: Franklyn Seymour Taylor Jr., CMMA (Chief Machinist's Mate, acting appointment), service number 3931674, USS Preston (DD-379), killed in action 15 November 1942, Solomon Islands. (Likely) \"KIA\" on the record stands for killed in action. It is not a place name. On the night of 14 November 1942, Preston was with U.S. battleships and destroyers trying to stop a Japanese force headed for Guadalcanal. Gunfire from the Japanese light cruiser Nagara hit her, and later hits probably set off her after ammunition magazine. (Confirmed) Abandon ship was ordered at 11:36 p.m. Preston rolled onto her side within minutes and sank about ten minutes later, taking 116 of her crew with her. (Confirmed) Ship histories place the sinking late on 14 November; his casualty record gives 15 November.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.lflld3ukd747", "folder": "https://drive.google.com/drive/folders/1GXqvAtK50ZLiq7DaIgDmMPyKSOzB62Ag", "svc": [{"w": "ww2", "s": "confirmed", "n": "U.S. Navy, Chief Machinist's Mate; killed in action aboard USS Preston off Guadalcanal, November 1942."}]}, {"id": "X32", "ahn": null, "name": "Warden Marion Taylor", "sex": "M", "b": 1918, "dd": 1918, "livi g, \"Mickey (Howard) Vietzke,\" who appears to be his sister Lois Mykeen Taylor (born 1934). (Likely)"], "military": "U.S. Marine Corps, enlisted after high school, probably in the mid-to-late 1950s. Dates, rank and unit are not yet known. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.9l3ulwlpyt8b", "folder": "https://drive.google.com/drive/folders/1j6QNJcMRKoYYh8T6LYvuyrsX3Mbp49MB", "svc": [{"w": "cold", "s": "confirmed", "n": "U.S. Marine Corps, mid-to-late 1950s."}, {"w": "vietnam", "s": "possible", "n": "Aged 26–35 during the war; no record found yet."}]}, {"id": "X42", "ahn": null, "name": "Jack Johnson", "sex": "M", "b": null, "dd": null, "living": false, "rel": "Great-uncle", "line": "Johnson", "f": "A8", "m": "A9", "sp": [], "summary": "Air Force; stationed near Spokane in 1958 (newspaper clipping); full name unknown", "svc": [{"w": "cold", "s": "confirmed", "n": "U.S. Air Force; stationed near Spokane in 1958."}]}, {"id": "X43", "ahn": null, "name": "Sid Johnson", "sex": "M", "b": null, "dd": null, "living": false, "rel": "Great-uncle", "line": "Johnson", "f": "A8", "m": "A9", "sp": [], "summary": "Air Force; stationed near Spokane in 1958 (newspaper clipping); full name unknown", "svc": [{"w": "cold", "s": "confirmed", "n": "U.S. Air Force; stationed near Spokane in 1958."}]}, {"id": "X24", "ahn": null, "name": "Sheila Rae Tripp Ernst", "sex": "F", "b": null, "dd": null, "living": false, "rel": "Günter's later wife", "line": "", "f": null, "m": null, "sp": ["X07"], "summary": "Married to Günter 32 years; died before him (obituary)"}, {"id": "X25", "ahn": null, "name": "Mark Ernst", "sex": "M", "b": null, "dd": null, "living": false, "rel": "Günter's child per obituary", "line": "Ernst", "f": "X07", "m": null, "sp": [], "summary": "Listed in Günter's obituary; not in Ancestry tree; mother not stated"}, {"id": "X26", "ahn": null, "name": "Craig Ernst", "sex": "M", "b": null, "dd": null, "livi const WARS = [{"id": "rev", "name": "Revolutionary War", "short": "Rev. War", "s": 1775, "e": 1783, "g": "mil", "about": "The thirteen American colonies fought Britain for independence from 1775. Besides the Continental Army, states raised short-term regiments called levies to guard their frontiers; New York's levies defended the Mohawk and Schoharie valleys against British and allied raids. Britain recognized American independence in the Treaty of Paris (1783)."}, {"id": "w1812", "name": "War of 1812", "short": "1812", "s": 1812, "e": 1815, "g": "mil", "about": "The United States fought Britain from 1812 to 1815 over the seizure of American sailors, trade restrictions and the western frontier. Much of the land fighting was along the Canadian border, and New York's militia was called out again and again. The Treaty of Ghent (December 1814) ended the war without changing borders."}, {"id": "napoleon", "name": "British Army, 1790s–1811", "short": "British Army", "s": 1793, "e": 1811, "g": "mil", "about": "From 1793 to 1815 Britain was almost always at war with Revolutionary and then Napoleonic France, and its army grew several times over. Many Scots enlisted, and soldiers' families often followed them from post to post. Records survive in War Office muster rolls and pension papers."}, {"id": "mex", "name": "Mexican–American War", "short": "Mexican War", "s": 1846, "e": 1848, "g": "mil", "about": "The United States fought Mexico from 1846 to 1848 and gained California and most of today's Southwest. About 500 Latter-day Saint men enlisted in the Mormon Battalion in 1846, at the start of the exodus from Nauvoo, and marched some 2,000 miles from Iowa to San Diego; their pay helped fund the move west."}, {"id": "dk1", "name": "First Schleswig War (Denmark)", "short": "Schleswig I", "s": 1848, "e": 1851, "g": "mil", "about": "From 1848 to 1851 Denmark fought German-speaking rebels in the duchies of Schleswig and Holstein, who were backed by Prussia and other German states. Denmark kept the duchies for the time being. Danish men were liable for military service, so men of the right age may have served."}, {"id": "crimea", "name": "Crimean War (Britain)", "short": "Crimea", "s": 1853, "e": 1856, "g": "mil", "about": "Britain, France, the Ottoman Empire and Sardinia fought Russia from 1853 to 1856, mostly on the Crimean peninsula. The battles of the Alma and Inkerman in 1854 were celebrated at home, and many British parents named children after them. The war is also remembered for Florence Nightingale and the Charge of the Light Brigade."}, {"id": "utah", "name": "Utah War", "short": "Utah War", "s": 1857, "e": 1858, "g": "mil", "about": "In 1857 President Buchanan sent about 2,500 troops to Utah to install a new governor, believing the territory was in rebellion. The Saints harassed the army's supply trains, and in spring 1858 some 30,000 people left their homes in the 'Move South', leaving a few men ready to burn Salt Lake City if the army attacked. A negotiated peace followed, and the army marched through the empty city in June 1858 to build Camp Floyd."}, {"id": "civil", "name": "Civil War", "short": "Civil War", "s": 1861, "e": 1865, "g": "mil", "about": "The Union and the Confederacy fought from 1861 to 1865 over slavery and secession. More than two million men served in the Union armies, and states such as Illinois raised large numbers of volunteer regiments; a federal draft began in 1863. Utah Territory sent only one small cavalry company, under Lot Smith."}, {"id": "dk2", "name": "Second Schleswig War (Denmark)", "short": "Schleswig II", "s": 1864, "e": 1864, "g": "mil", "about": "In 1864 Prussia and Austria defeated Denmark and took the duchies of Schleswig, Holstein and Lauenburg, a large part of the kingdom. The defeat, and later Prussian conscription in the lost lands, encouraged many Danes to emigrate, including to Utah."}, {"id": "blackhawk", "name": "Black Hawk War (Utah)", "short": "Black Hawk", "s": 1865, "e": 1872, "g": "mil", "about": "From 1865 to 1872 Ute bands led at first by Antonga Black Hawk raided Latter-day Saint settlements in central and southern Utah, driven by the loss of land and food to settlers. The territorial militia, the Nauvoo Legion, was called out repeatedly, and dozens of small settlements were abandoned for a time. Veterans later received recognition and some pensions."}, {"id": "spam", "name": "Spanish–American War", "short": "Spanish-Am.", "s": 1898, "e": 1898, "g": "mil", "about": "The United States fought Spain in 1898 over Cuba and gained Puerto Rico, Guam and the Philippines. Utah raised volunteer artillery batteries (the Utah Light Artillery) that served in the Philippines, and other Utah men joined cavalry units."}, {"id": "ww1", "name": "World War I", "short": "WWI", "s": 1917, "e": 1918, "g": "mil", "about": "The United States entered the First World War in April 1917. Three draft registrations in 1917 and 1918 signed up about 24 million men aged 18 to 45, and about four million served. Draft registration cards survive for nearly every man of that age, even those who never served, so they are a key record."}, {"id": "ww1de", "name": "World War I (Germany)", "short": "WWI", "s": 1914, "e": 1918, "g": "mil", "about": "Germany fought the First World War from 1914 to 1918 with universal conscription; about 13 million German men served. Casualty lists (Verlustlisten) for 1914 to 1919 are indexed online and name men who were wounded, captured or killed."}, {"id": "ww2", "name": "World War II", "short": "WWII", "s": 1941, "e": 1945, "g": "mil", "about": "The United States fought in the Second World War from December 1941 to 1945; about 16 million Americans served, most of them drafted under the 1940 Selective Service Act. Army enlistment records, draft cards and unit histories are the main sources, though many personnel files were damaged in the 1973 St. Louis records fire."}, {"id": "ww2de", "name": "World War II (Germany)", "short": "WWII", "s": 1939, "e": 1945, "g": "mil", "about": "Germany fought the Second World War from 1939 to 1945. Most men of military age were conscripted into the Wehrmacht, and older men and boys were called into the Volkssturm militia in 1944 and 1945. Records are held by the German Federal Archives and the Volksbund war graves commission."}, {"id": "korea", "name": "Korean War", "short": "Korea", "s": 1950, "e": 1953, "g": "mil", "about": "From 1950 to 1953 United Nations forces led by the United States fought to defend South Korea against North Korea and, from late 1950, China. About 1.8 million Americans served in the Korean theater, many of them World War II veterans recalled to duty, including Air Force pilots. An armistice in July 1953 ended the fighting."}, {"id": "vietnam", "name": "Vietnam War", "short": "Vietnam", "s": 1964, "e": 1973, "g": "mil", "about": "American involvement in Vietnam grew sharply after the Gulf of Tonkin incident in 1964 and lasted until the Paris Peace Accords in 1973. About 2.7 million Americans served in Vietnam; a draft lottery began in 1969. Career officers often served tours there alongside draftees."}, {"id": "cold", "name": "Peacetime / Cold War service", "short": "Cold War", "s": 1946, "e": 1991, "g": "mil", "about": "After 1945 the United States kept a large peacetime military to face the Soviet Union, and the draft continued until 1973. Many men served two to four years in the Army, Navy or Marines, often in West Germany, and the new Air Force built bases across the country, including Geiger Field and Fairchild Air Force Base near Spokane."}, {"id": "ch_gather", "name": "Gathering to Zion (emigration)", "short": "Emigrant", "g": "ch", "o": 0, "about": "From the 1840s, converts in Britain, Scandinavia and Europe were taught to 'gather to Zion' in the American West. About 90,000 emigrated by 1890, most from Britain, Wales and Scandinavia, sailing from Liverpool to New Orleans or, after 1855, to East Coast ports. The Perpetual Emigrating Fund, set up in 1849, lent passage money that emigrants repaid after they settled."}, {"id": "ch_trail", "name": "Wagon and handcart companies", "short": "Pioneer trail", "g": "ch", "o": 1, "about": "Between 1847 and 1868 about 60,000 to 70,000 Latter-day Saints crossed the plains to Utah in organized companies, each with a captain and roster. From 1856 to 1860 about 3,000 walked pulling handcarts, including the ill-fated Willie and Martin companies of 1856; in the 1860s 'down-and-back' wagon trains sent from Utah carried emigrants from the railhead. The railroad's completion in 1869 ended the trail era."}, {"id": "ch_early", "name": "Early Church: Nauvoo and Winter Quarters", "short": "Nauvoo era", "g": "ch", "o": 2, "about": "Before Utah, the Saints gathered in Kirtland, Ohio, in Missouri, and from 1839 at Nauvoo, Illinois, which grew into one of the largest towns in the state. Driven out in 1846, they crossed Iowa and wintered at Winter Quarters on the Missouri River, where hundreds died of exposure and disease before the first companies reached the Salt Lake Valley in 1847."}, {"id": "ch_mission", "name": "Missionaries", "short": "Missionary", "g": "ch", "o": 3, "about": "Latter-day Saint men, often married with families, were 'called' to serve unpaid missions of two to three years, at home or abroad. British, Welsh and Scandinavian missions produced most of the converts who emigrated to Utah, and returning missionaries often led emigrant companies. Missionary records are in the Church History Library and the Church History Biographical Database."}, {"id": "ch_leader", "name": "Church leadership and callings", "short": "Church leader", "g": "ch", "o": 4, "about": "The Church is led by unpaid local members. Bishops lead wards (congregations), stake presidents lead stakes (groups of wards), Seventies were priesthood quorums focused on missionary work, and patriarchs give blessings. The Relief Society, founded in Nauvoo in 1842, is the women's organization, and its leaders }
function elbow(l) {
  const [sx, sy] = l.s, [tx, ty] = l.t;
  if (l.k === "sp") return `M${sx},${sy + Math.sign(ty) * H/2}V${ty - Math.sign(ty) * H/2}`;
  const dir = Math.sign(tx - sx), x0 = sx + dir * W/2, x1 = tx - dir * W/2, mx = (x0 + x1) / 2;
  return `M${x0},${sy}H${mx}V${ty}H${x1}`;
}
// Veteran view: expand the pedigree just far enough to show every matching person.
// Siblings of an ancestor (e.g. a great-uncle who served) are stacked in that ancestor's column.
function vetLayout() {
  const target = new Set(DATA.filter(p => milMatches(p).length).map(p => p.id));
  const sibsOf = id => { const p = P[id]; return DATA.filter(q => q.id !== id && !q.ahn && ((p.f && q.f === p.f) || (p.m && q.m === p.m))).map(q => q.id); };
  const memo = {};
  const relevant = id => {
    if (!id || !P[id]) return false;
    if (id in memo) return memo[id];
    memo[id] = false;
    return memo[id] = target.has(id) || sibsOf(id).some(s => target.has(s)) || relevant(P[id].f) || relevant(P[id].m);
  };
  const mkGroup = main => {
    const extras = sibsOf(main).filter(s => target.has(s));
    const members = [main, ...extras].sort((a, b) => (P[a].b || 9999) - (P[b].b || 9999));
    return {mains: [main], members};
  };
  const sp0 = startPerson();
  const rootMains = startId === "family" ? COUPLE.slice() : [sp0, ...(P[sp0].sp || []).filter(s => P[s] && relevant(s))];
  const root = {mains: rootMains, members: rootMains, root: true};
  const kidsOf = g => g.mains.flatMap(m => [P[m].f, P[m].m].filter(x => x && P[x] && relevant(x)).map(mkGroup));
  const hier = d3.hierarchy(root, kidsOf);
  d3.tree().nodeSize([ROW, COL]).separation((a, b) => (a.data.members.length + b.data.members.length) / 2 + (a.parent === b.parent ? 0.1 : 0.4))(hier);
  const pos = {}, nodes = [], links = [];
  hier.each(n => {
    const k = n.data.members.length;
    n.data.members.forEach((id, i) => {
      const x = n.y, y = n.x + (i - (k - 1) / 2) * ROW;
      if (pos[id]) return;
      pos[id] = [x, y]; nodes.push({id, x, y, focus: id === focusId});
    });
  });
  hier.each(n => {
    if (n.data.root) {
      for (let i = 1; i < rootMains.length; i++) links.push({s: pos[rootMains[0]], t: pos[rootMains[i]], k: "sp"});
    }
    (n.children || []).forEach(c => {
      const par = c.data.mains[0];
      const from = n.data.root ? n.data.mains.filter(m => P[m].f === par || P[m].m === par) : n.data.members.filter(m => P[m].f === par || P[m].m === par);
      from.forEach(m => links.push({s: pos[m], t: pos[par], k: "ln"}));
    });
  });
  const missing = [...target].filter(id => !pos[id]);
  return {nodes, links, missing};
}
let lastMissing = [];
function render(fit = true) {
  const gens = +document.getElementById("gens").value;
  const L = milSel ? vetLayout() : layout(focusId, gens);
  const {nodes, links} = L; lastMissing = L.missing || [];
  document.getElementById("gens").disabled = !!milSel; document.getElementById("gens").title = milSel ? "The tree opens as far as needed to show everyone selected" : "";
  vp.selectAll("*").remove();
  vp.append("g").selectAll("path").data(links).join("path").attr("class", d => d.k).attr("d", elbow);
  const g = vp.append("g").selectAll("g").data(nodes, d => d.id).join("g")
    .attr("class", d => "node" + (d.focus ? " focus" : "") + (d.id === selId ? " sel" : ""))
    .attr("transform", d => `translate(${d.x - W/2},${d.y - H/2})`)
    .attr("tabindex", 0).attr("role", "button")
    .attr("aria-label", d => `${P[d.id].name}, ${dates(P[d.id])}`);
  g.append("rect").attr("class", "card").attr("width", W).attr("height", H).attr("rx", 7);
  g.append("circle").attr("cx", 14).attr("cy", 18).attr("r", 4.5).attr("fill", d => lc(P[d.id]));
  g.append("text").attr("class", "nm").attr("x", 25).attr("y", 22).text(d => trunc(P[d.id].name, P[d.id].tab ? 19 : 24));
  g.append("text").attr("class", "dt").attr("x", 25).attr("y", 40).text(d => dates(P[d.id]));
  g.filter(d => AHN[d.id] > 1).append("text").attr("class", "ahn").attr("x", W - 9).attr("y", 40).attr("text-anchor", "end").text(d => "No. " + AHN[d.id]);
  g.filter(d => P[d.id].tab).append("text").attr("class", "pg").attr("x", W - 9).attr("y", 16).attr("text-anchor", "end").text("PAGE");
  if (milSel) {
    g.classed("dim", d => !milMatches(P[d.id]).length);
    const pl = g.filter(d => milMatches(P[d.id]).length).append("g").attr("class", d => "pill " + milMatches(P[d.id]).sort((a, b) => STRANK[a.s] - STRANK[b.s])[0].s)
      .attr("transform", "translate(10,-12)");
    pl.append("text").attr("x", 7).attr("y", 11.5).text(d => {
      const m = milMatches(P[d.id]); const t = m.slice(0, 2).map(x => WAR[x.w].short).join(" · ") + (m.length > 2 ? " +" + (m.length - 2) : "");
      return (m.some(x => x.s === "confirmed") ? "★ " : "") + t;
    });
    pl.insert("rect", "text").attr("height", 16).attr("rx", 8).attr("width", function() { return this.parentNode.querySelector("text").getComputedTextLength() + 14; });
    pl.append("title").text(d => milMatches(P[d.id]).map(x => `${WAR[x.w].name}: ${STLABEL[x.s]}`).join("\n"));
  }
  g.on("pointerenter", (e, d) => { if (e.pointerType === "mouse") showTip(e, d.id); })
   .on("pointermove", (e) => { if (e.pointerType === "mouse") moveTip(e); })
   .on("pointerleave", hideTip)
   .on("click", (e, d) => { hideTip(); select(d.id); })
   .on("dblclick", (e, d) => { e.stopPropagation(); setFocus(d.id); })
   .on("keydown", (e, d) => { if (e.key === "Enter") { e.shiftKey ? setFocus(d.id) : select(d.id); } });
  if (fit) fitView();
}
function fitView() {
  const box = vp.node().getBBox(), el = svg.node().getBoundingClientRect();
  if (!box.width) return;
  const k = Math.min(1.1, 0.92 * Math.min(el.width / box.width, el.height / box.height));
  const t = d3.zoomIdentity.translate(el.width/2 - k*(box.x + box.width/2), el.height/2 - k*(box.y + box.height/2)).scale(k);
  svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450).call(zoom.transform, t);
}
const tip = document.getElementById("tip");
function showTip(e, id) {
  const p = P[id];
  const body = p.living ? "Living. Details are kept private." : (trunc(p.summary || p.role || "", 260) || "No summary yet. If you know something, open this person and choose Share what you know.");
  const sv = svcOf(p).filter(x => x.s !== "possible");
  tip.innerHTML = `<b>${esc(p.name)}</b><span class="d">${esc(dates(p))}${relOf(id) ? " · " + esc(relOf(id)) : ""}</span>${sv.length ? `<p>★ ${esc(sv.map(x => WAR[x.w].name + (x.s === "lead" ? " (lead)" : "")).join(", "))}</p>` : ""}<p>${esc(body)}</p><div class="hint">Click for details · double-click to center</div>`;
  tip.hidden = false; moveTip(e);
}
function moveTip(e) {
  const r = document.getElementById("canvas").getBoundingClientRect();
  let x = e.clientX - r.left + 16, y = e.clientY - r.top + 14;
  if (x + 310 > r.width) x = e.clientX - r.left - 316;
  if (y + tip.offsetHeight > r.height) y = Math.max(8, r.height - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }

const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
function chip(id) { const p = P[id]; return `<button class="chip" type="button" data-id="${id}">${esc(p.name)} <span class="d">${esc(dates(p))}</span></button>`; }
function relList(title, ids) { ids = ids.filter(x => x && P[x]); return ids.length ? `<h3>${title}</h3><div class="chips">${ids.map(chip).join("")}</div>` : ""; }
function select(id) {
  selId = id; const p = P[id];
  vp.selectAll(".node").classed("sel", d => d.id === id);
  const sibs = DATA.filter(q => q.id !== id && ((p.f && q.f === p.f) || (p.m && q.m === p.m))).sort((a,b)=>(a.b||9999)-(b.b||9999)).map(q => q.id);
  const rl = relOf(id);
  let h = topicBlocks(topicIds(p)) + `<h2>${esc(p.name)}</h2><div class="d">${esc(dates(p))}${AHN[id] > 1 ? " · Ahnentafel no. " + AHN[id] : ""}</div>`;
  if (rl || p.line) h += `<div class="rel"><i style="background:${lc(p)}"></i>${esc(rl)}${rl && p.line ? " · " : ""}${p.line ? `<span title="${esc((LINE[p.line] || {}).about || "")}">${esc(p.line)} line</span>` : ""}</div>`;
  if (rl && !/^Starting/.test(rl)) h += `<div class="from">Relationship to ${esc(startId === "family" ? startName() : P[startId].name)}, where the tree starts.</div>`;
  if (p.living) {
    h += `<p class="empty">Living. Only the name and birth year are shown here.</p>`;
  } else {
    if (p.role) h += `<p>${esc(p.role)}</p>`;
    if (p.facts && p.facts.length) h += `<ul>${p.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
    const sv = svcOf(p);
    const svList = (t, arr) => arr.length ? `<h3>${t}</h3><ul class="svc">${arr.map(x => `<li><span class="badge ${x.s}">${STLABEL[x.s]}</span><span class="w">${esc(WAR[x.w].name)}</span><span class="n">${esc(x.n)}</span></li>`).join("")}</ul>` : "";
    h += svList("Wars", sv.filter(x => WAR[x.w].g === "mil")) + svList("Pioneer &amp; church history", sv.filter(x => WAR[x.w].g === "ch"));
    if (p.summary) h += `<h3>Life summary</h3><p>${esc(p.summary)}</p>`;
    if (p.military) h += `<h3>Military service</h3><p>${esc(p.military)}</p>`;
    if (p.notable && p.notable.length) h += `<h3>Notable</h3><ul>${p.notable.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
    if (p.contrib && p.contrib.length) h += `<h3>From the family</h3>` + p.contrib.map(c => `<div class="contrib">${esc(c.t)}<span class="who">Shared by ${esc(c.by)}${c.d ? ", " + esc(c.d) : ""}</span></div>`).join("");
    if (!p.summary && !p.role && !(p.facts||[]).length && !(p.contrib||[]).length) h += `<p class="empty">Nothing researched yet. If you know something about ${esc(first(id))}, please share it.</p>`;
  }
  h += `<div class="actions">${id !== focusId ? `<button class="primary" type="button" data-focus="${id}">Center tree here</button>` : ""}`;
  if (id !== startId) h += `<button type="button" data-start="${id}">Start the tree from ${esc(first(id))}</button>`;
  h += `<button type="button" data-contrib="${id}">Share what you know</button>`;
  if (p.tab) h += `<a href="${p.tab}" target="_blank" rel="noopener">Full page in family doc</a>`;
  if (p.folder) h += `<a href="${p.folder}" target="_blank" rel="noopener">Photos and documents</a>`;
  h += `</div>`;
  h += relList("Parents", [p.f, p.m]) + relList(p.sp.length > 1 ? "Spouses" : "Spouse", p.sp) + relList("Children", kids[id] || []) + relList("Siblings", sibs);
  if (p.tab || p.folder) h += `<p class="note">The family doc and photo folders open only for relatives they have been shared with.</p>`;
  pbody.innerHTML = h; panel.classList.remove("idle"); panel.scrollTop = 0;
}
pbody.addEventListener("toggle", e => {
  const d = e.target.closest && e.target.closest("details.topic"); if (!d) return;
  d.open ? openTopics.add(d.dataset.topic) : openTopics.delete(d.dataset.topic);
}, true);
pbody.addEventListener("click", e => {
  const c = e.target.closest("[data-id]"), f = e.target.closest("[data-focus]"), st = e.target.closest("[data-start]"), co = e.target.closest("[data-contrib]");
  if (st) setStart(st.dataset.start);
  else if (co) openContrib(co.dataset.contrib);
  else if (f) setFocus(f.dataset.focus);
  else if (c) setFocus(c.dataset.id);
});
document.getElementById("pclose").onclick = () => panel.classList.add("idle");
function setFocus(id) {
  focusId = id; try { history.replaceState(null, "", "#" + id); } catch(e) {}
  if (milSel) {
    render(false); select(id);
    const n = vp.selectAll(".node").filter(d => d.id === id).datum();
    if (n) {
      const el = svg.node().getBoundingClientRect(), k = 1;
      svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450)
        .call(zoom.transform, d3.zoomIdentity.translate(el.width / 2 - k * n.x, el.height / 2 - k * n.y).scale(k));
    } else fitView();
    return;
  }
  render(); select(id);
}
document.getElementById("gens").onchange = () => render();
document.getElementById("home").onclick = () => setFocus(startPerson());

// ---------- Start-from picker
const startSel = document.getElementById("start");
function buildStartOptions() {
  const fam = new Set();
  const walk = id => (kids[id] || []).forEach(k => { if (!fam.has(k)) { fam.add(k); walk(k); } });
  COUPLE.forEach(walk);
  [...fam].forEach(id => (P[id].sp || []).forEach(s => P[s] && fam.add(s)));
  const people = DATA.filter(p => fam.has(p.id) || p.living || (p.b && p.b >= 1900)).sort((a, b) => a.name.localeCompare(b.name));
  if (startId !== "family" && !people.some(p => p.id === startId)) people.unshift(P[startId]);
  startSel.innerHTML = `<option value="family">${esc(first(COUPLE[0]) + " & " + first(COUPLE[1]))}'s family</option>` +
    `<optgroup label="Or start from a person">` + people.map(p => `<option value="${p.id}">${esc(p.name)}${p.b ? " (" + p.b + ")" : ""}</option>`).join("") + `</optgroup>`;
  startSel.value = startId;
}
function setStart(id) {
  startId = id;
  try { localStorage.setItem("start", id); } catch (e) {}
  try { const qs = new URLSearchParams(location.search); qs.set("start", id); history.replaceState(null, "", location.pathname + "?" + qs.toString() + "#" + startPerson()); } catch (e) {}
  buildAhn(); buildStartOptions();
  document.getElementById("home").textContent = "Back to " + startName();
  setFocus(startPerson());
}
startSel.onchange = () => setStart(startSel.value);
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = s; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok;
  }
}
document.getElementById("share").onclick = async () => {
  const u = new URL(location.href); u.searchParams.delete("v"); u.searchParams.set("start", startId); u.hash = "";
  if (!/^https?:$/.test(u.protocol)) u.href = "https://mattjohnson6500-max.github.io/family-tree/?start=" + encodeURIComponent(startId);
  const ok = await copyText(u.href);
  toast(ok ? `Link copied. It opens the tree starting from ${startName()}.` : u.href);
};

// ---------- Share what you know
const cdlg = document.getElementById("contrib");
function openContrib(id) {
  const p = P[id];
  document.getElementById("cintro").textContent = `Anything helps: dates, places, stories, corrections, or where a photo or document can be found. ${p.living ? "This person is living, so only name and birth year appear on the public tree." : ""}`;
  document.getElementById("ctext").value = `About: ${p.name} (${dates(p)}) [${p.id}]\n\nWhat I know:\n\n\nHow I know it (memory, a document, a photo, someone told me):\n\n\nMy name (shown as "Shared by"):\n`;
  const form = document.getElementById("cform");
  form.hidden = !FORM_URL; if (FORM_URL) form.href = FORM_URL;
  document.getElementById("cnote").textContent = FORM_URL ? "Fill in the family form, or copy this note and send it to whoever keeps the family history." : "Copy this note and send it (text or email) to whoever keeps the family history. It will be added with your name.";
  if (cdlg.showModal) cdlg.showModal(); else cdlg.setAttribute("open", "");
}
document.getElementById("ccancel").onclick = () => cdlg.close ? cdlg.close() : cdlg.removeAttribute("open");
document.getElementById("ccopy").onclick = async () => { const ok = await copyText(document.getElementById("ctext").value); toast(ok ? "Note copied" : "Select the text and copy it"); };
buildStartOptions();
document.getElementById("home").textContent = "Back to " + startName();
document.getElementById("q").addEventListener("change", e => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const hit = DATA.find(p => `${p.name} (${dates(p)})`.toLowerCase() === v) || DATA.find(p => p.name.toLowerCase().includes(v.replace(/\s*\(.*$/, "")));
  if (hit) { setFocus(hit.id); e.target.value = ""; e.target.blur(); }
});
document.getElementById("zin").onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById("zout").onclick = () => svg.transition().call(zoom.scaleBy, 1/1.3);
document.getElementById("zfit").onclick = fitView;
window.addEventListener("resize", () => fitView());
render(); select(focusId);
if (matchMedia("(max-width:760px)").matches) panel.classList.add("idle");
</script>
