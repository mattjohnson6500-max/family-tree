<style>
/* Layout: full-screen pedigree canvas — ancestors run right, descendants left — with a top toolbar and a details panel (side on desktop, bottom sheet on phones). */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1c2530; --muted:#5d6b7a; --rule:#d5dce3; --link:#9aa6b2;
  --accent:#2f5d8a; --focus-ring:#2f5d8a;
  --platt:#1f7a72; --lyon:#7a4b86; --johnson:#2f5d8a; --taylor:#a2671c; --ernst:#4d7a2f; --none:#6b7785; --b6:#9a3d4f; --b7:#3d6f9a; --b8:#7a6a2f;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222b; --fg:#e4e9ee; --muted:#97a4b2; --rule:#2e3843; --link:#4a5663;
  --accent:#7fb0e0; --focus-ring:#7fb0e0;
  --platt:#4fb8ad; --lyon:#b88ac4; --johnson:#7fb0e0; --taylor:#e0a557; --ernst:#93c06c; --none:#97a4b2; --b6:#e08a9b; --b7:#8fbfe6; --b8:#cdb86a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --fg:#e4e9ee; --muted:#97a4b2; --rule:#2e3843; --link:#4a5663;
  --accent:#7fb0e0; --focus-ring:#7fb0e0;
  --platt:#4fb8ad; --lyon:#b88ac4; --johnson:#7fb0e0; --taylor:#e0a557; --ernst:#93c06c; --none:#97a4b2; --b6:#e08a9b; --b7:#8fbfe6; --b8:#cdb86a; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.2px;white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
.controls label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input[type=search],select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 9px}
input[type=search]{width:min(240px,100%);min-width:0}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.main{position:relative;flex:1;min-height:0;display:flex}
#canvas{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg:active{cursor:grabbing}
.node rect.card{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.node:hover rect.card,.node.sel rect.card{stroke:var(--accent);stroke-width:1.6}
.node.focus rect.card{stroke:var(--accent);stroke-width:2.2}
.node{cursor:pointer}
.node text.nm{font-family:var(--display);font-weight:600;font-size:13.5px;fill:var(--fg)}
.node text.dt{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.node text.ahn{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.node .pg{font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.06em;fill:var(--accent)}
path.ln{fill:none;stroke:var(--link);stroke-width:1.3}
path.sp{fill:none;stroke:var(--link);stroke-width:1.3;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;max-width:300px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.14);font-size:12.5px;line-height:1.45;z-index:5}
.tip b{font-family:var(--display);font-size:15px;display:block}
.tip .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tip p{margin:6px 0 0}
.tip .hint{margin-top:6px;font-size:11px;color:var(--muted)}
aside{width:380px;max-width:100%;border-left:1px solid var(--rule);background:var(--surface);overflow-y:auto;padding-block:18px 28px;padding-inline:20px}
aside h2{font-family:var(--display);font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
aside .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
aside .rel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
aside .rel i{width:9px;height:9px;border-radius:50%}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 6px;font-weight:600}
aside p,aside li{line-height:1.55;max-width:65ch}
aside ul{padding-left:18px;margin:4px 0}
aside li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--rule)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions a,.actions button{font-size:13px;text-decoration:none;color:var(--fg);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;background:var(--bg)}
.actions .primary,dialog .primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.close{display:none}
.empty{color:var(--muted);line-height:1.6}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;padding:0;background:var(--surface);font-size:16px}
/* Topic accordion (selected war or pioneer & church category) */
.topic{border:1px solid var(--rule);border-radius:8px;background:var(--bg);margin:0 0 10px}
.topic summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:10px 12px}
.topic summary::-webkit-details-marker{display:none}
.topic .tk{grid-column:1;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topic .tt{grid-column:1;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;color:var(--fg)}
.topic .ty{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.topic .chev{grid-column:2;grid-row:1 / span 2;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.topic[open] .chev{transform:rotate(-135deg);margin-top:4px}
.topic summary:hover .tt{color:var(--accent)}
.topic .tb{padding:0 12px 12px;border-top:1px solid var(--rule)}
.topic .tb p{margin:10px 0 0;font-size:13.5px}
.topic .tn{color:var(--muted);font-size:12.5px!important}
.topics{margin-bottom:16px}
/* Military filter */
select:disabled{opacity:.45;cursor:not-allowed}
.mil{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.mil .tog{display:inline-flex;align-items:center;gap:5px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--fg)}
.node.dim{opacity:.28}
.node .pill rect{stroke:var(--accent);stroke-width:1.2}
.node .pill.confirmed rect{fill:var(--accent)}
.node .pill.lead rect,.node .pill.possible rect{fill:var(--surface)}
.node .pill.possible rect{stroke-dasharray:3 2}
.node .pill text{font-family:var(--body);font-size:9.5px;font-weight:600;letter-spacing:.03em}
.node .pill.confirmed text{fill:var(--surface)}
.node .pill.lead text,.node .pill.possible text{fill:var(--accent)}
.svc{list-style:none;padding:0;margin:4px 0}
.svc li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:8px 0}
.svc .w{font-weight:600}
.svc .n{grid-column:2;color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1.2px solid var(--accent);color:var(--accent);white-space:nowrap;align-self:start}
.badge.confirmed{background:var(--accent);color:var(--surface)}
.badge.possible{border-style:dashed}
.vets h3{display:flex;align-items:baseline;gap:8px}
.vets .sub{font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.vets .chips{margin-bottom:6px}
.chip.c-confirmed{border-color:var(--accent)}
.chip.c-possible{border-style:dashed}
.keyrow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:12px 0 4px;font-size:12.5px;color:var(--muted)}
.keyrow .badge{justify-self:start}
.startbox{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
#start{max-width:250px}
.from{font-size:12px;color:var(--muted);margin-top:4px}
.contrib{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}
.contrib .who{display:block;font-size:12px;color:var(--muted);margin-top:2px}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--fg);max-width:min(520px,calc(100vw - 32px));padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-family:var(--display);margin:0 0 8px;font-size:20px}
dialog textarea{box-sizing:border-box;width:100%;min-height:200px;font:13px/1.45 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px}
dialog a.primary{display:inline-block;padding:6px 9px;border-radius:6px;text-decoration:none}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
@media (max-width:760px){
  h1{font-size:18px;flex-basis:100%}
  .controls{flex-basis:100%}
  .mil{width:100%}
  #mil,#chs{flex:1 1 200px;min-width:0}
  #start{flex:1 1 120px;min-width:0;max-width:none}
  .startbox label{flex-basis:100%}
  .startbox{width:100%}
  .topics{margin-top:34px}
  .legend{display:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  aside.idle{display:none}
  .close{display:block;position:absolute;right:12px;top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

ground fighting in Normandy. He was promoted to captain by October 1944, became his squadron's operations officer, and completed his tour in January 1945. He stayed in the Air Force after the war; in 1958 he was a major at Geiger Field in Spokane, where his brothers Jack and Sid were also stationed.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.m7kz4ia84025", "folder": "https://drive.google.com/drive/folders/1hYofvvqeVVkB35nLrjGwltiL39zUzQO3", "svc": [{"w": "ww2", "s": "confirmed", "n": "B-17 pilot, 92nd Bomb Group, Eighth Air Force; 1944–45 combat tour."}, {"w": "korea", "s": "confirmed", "n": "Flew combat missions in Korea (2002 obituary)."}, {"w": "cold", "s": "confirmed", "n": "Career Air Force officer; retired a colonel and base commander."}, {"w": "vietnam", "s": "possible", "n": "Aged 44–53 during the war; no record found yet."}]}, {"id": "A5", "ahn": 5, "name": "Josephine Rhae Taylor", "sex": "F", "b": 1922, "dd": 1982, "living": false, "rel": "Grandmother", "line": "Taylor", "f": "A10", "m": "A11", "sp": ["A4"], "facts": ["Daughter of Franklyn Seymour Taylor and Esther Elvira Williams; wife of Alfred Edgar Johnson. FamilySearch ID KCZF-D7Y.", "Born 1 October 1922 according to Find a Grave (FamilySearch gives 1921). Died 4 October 1982; buried at Larkin Sunset Gardens, Sandy, Utah. (Likely)", "Father: Franklyn Seymour Taylor, born in England in 1886.", "Married Alfred Edgar Johnson on 16 September 1939; their son Dennis Ray Johnson was born in 1941. (Confirmed; Alfred's obituary)"], "summary": "Josephine was the fifth of 13 children of Franklyn Seymour Taylor, an English-born father, and Esther Elvira Williams. She came from Spokane, in a large family that lost two baby boys in infancy and her older brother Franklyn Jr. in the Pacific in 1942. She married Alfred Edgar Johnson, and their son Dennis was born in 1941; Alfred flew B-17s from England in 1944 and made a career in the Air Force. By 1958 they were living in Spokane again, where a newspaper story about Alfred and his brothers identified her as the former Josephine Taylor of Spokane. She died in 1982.", "notable": ["29 September 1958: a Spokane newspaper story about Alfred and his Air Force brothers names her as the former Josephine Taylor of Spokane. (Confirmed)", "Her older brother Franklyn Seymour Taylor Jr. was killed in action aboard the destroyer USS Preston at Guadalcanal in November 1942.", "Her brothers and sisters, with FamilySearch IDs, are listed on the Taylor Line tab."], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.c1f28khfawtu", "folder": "https://drive.google.com/drive/folders/1Hrtlbys0qpVnTPAebPByjMr-CcS_AwQt"}, {"id": "A6", "ahn": 6, "name": "Ross Edgar Lyon", "sex": "M", "b": 1924, "dd": 1998, "living": false, "rel": "Grandfather", "line": "Lyon", "f": "A12", "m": "A13", "sp": ["A7"], "role": "Edith's father. Husband of Marjorie Anne Platt.", "facts": ["Born 26 July 1924. Died 13 June 1998 at home. (Confirmed; Deseret News death notice)", "Parents: Joseph V. Lyon and Constance M. Swenson, as the death notice spells it. (Confirmed; Deseret News death notice)", "Married Marjorie Ann Platt in the Salt Lake Temple; date not yet found. (Confirmed for place; Deseret News death notice)", "Brother: T. Jack Lyon, who died before 1998; he served a mission in Hawaii and then entered the Army. (Confirmed; Deseret News, 1998 and 3 February 1944)", "Four children, including Edith Louise Lyon (1948–living); living relatives are listed by name and birth year only."], "summary": "Ross was a lifelong Utahn. He went to South High School and the University of Utah and spent his working life in the graphic arts: he ran his own business as a printer, graphic designer and advertising man, and was still working full days shortly before he died. He was an avid golfer and an artist, remembered for his humor. He died at home in 1998 at 73 and was buried at Holladay Memorial Park after a funeral in the Holladay 14th Ward. Printing ran in his family: his grandfather David Ross Lyon owned a Salt Lake printing company, and his great-grandfather was the poet John Lyon.", "notable": ["Business owner: his own printing, graphic design and advertising business. (Confirmed)", "Followed his grandfather David Ross Lyon, owner of the Magazine Printing Company, into the printing trade. (Confirmed)", "Matt Johnson's Ancestry tree wrongly shows Ross as living; the death notice confirms he died in 1998."], "military": "World War II: enlisted in the U.S. Army at Salt Lake City on 3 May 1943, aged 18, as a private (draftee), serial number 39913448. (Confirmed; National Archives, WWII Army Enlistment Records) His unit, service and discharge are not yet known.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.c90vndxu43au", "folder": "https://drive.google.com/drive/folders/1XYkE7U1qaboLHYLi3TeCNukve4KN2n53", "svc": [{"w": "ww2", "s": "confirmed", "n": "U.S. Army, enlisted 3 May 1943 at Salt Lake City (National Archives)."}, {"w": "korea", "s": "possible", "n": "Aged 26–29 during the war; no record found yet."}]}, {"id": "A7", "ahn": 7, "name": "Marjorie Anne Platt", "sex": "F", "b": 1925, "dd": 2014, "living": false, "rel": "Grandmother", "line": "Platt", "f": "A14", "m": "A15", "sp": ["A6"], "summary": "Grandmother. Born 2 April 1925 and died 9 February 2014. She married Ross Edgar Lyon, and the couple lived for many years in and around Salt Lake City. Her father died when she was about 13.", "notable": ["Funeral arrangements by Memorial Mortuaries and Cemeteries, a Salt Lake area firm (Confirmed).", "Family-reported: lived many years in the Salt Lake City area with Ross.", "Wanted: her full obituary, wedding date and place, and life story from family."]}, {"id": "A8", "ahn": 8, "name": "Jens Magnus Johansen", "sex": "M", "b": 1888, "dd": 1953, "living": false, "rel": "Great-grandfather", "line": "Johnson", "f": "A16", "m": "A17", "sp": ["A9"], "summary": "Alfred's father, called \"Jim\". A Danish immigrant, homesteading near Mandan, North Dakota, in 1920 (Confirmed; Alfred's obituary). Very probably the James M. Johnson, born in Denmark about 1888, who lived in Snohomish County, Washington, in 1950 with his wife Selma and died in Marysville on 27 January 1953 (Likely; 1950 census and Washington death index).", "svc": [{"w": "ww1", "s": "possible", "n": "Aged 29–30 during the war; no record found yet."}]}, {"id": "A9", "ahn": 9, "name": "Selma Martina Thomsen", "sex": "F", "b": 1892, "dd": 1968, "living": false, "rel": "Great-grandmother", "line": "Johnson", "f": "A18", "m": "A19", "sp": ["A8"], "summary": "Alfred's mother. A Danish immigrant (Confirmed; Alfred's obituary). Probably the Selma Johnson, born in Denmark about 1893, living with James in Snohomish County, Washington, in 1950 (Likely). Two Selma Johnsons died in Spokane in 1968; which is hers is not yet known."}, {"id": "A10", "ahn": 10, "name": "Franklyn Seymour Taylor", "sex": "M", "b": 1886, "dd": 1959, "living": false, "rel": "Great-grandfather", "line": "Taylor", "f": "A20", "m": "A21", "sp": ["A11"], "role": "Josephine's father. FamilySearch ID KP45-HW6.", "facts": ["Born 1 February 1886, Alresford, Hampshire, England. Died 10 October 1959, Spokane, Washington. (Lead; Ancestry member tree, not yet checked against an original record)", "Matt Johnson's Ancestry tree gives his dates as 1884–1960 instead, so his birth and death years need checking against records.", "Mother: Caroline Frances Gambier. Father: not known; the fan chart names Robert Walling, but no record found so far supports that.", "Wife: Esther Elvira Williams (1894–1978), married in Idaho; date not yet found. (Lead; Ancestry member tree, not yet checked against an original record)", "13 children, listed on the Taylor Line tab."], "summary": "Franklyn appears to have been born in Hampshire, England, in 1886, the son of Caroline Frances Gambier, whose family lived in London and Watford. How he came to carry the surname Taylor is not known. He came to America, married Esther Elvira Williams in Idaho, and raised 13 children in Spokane, where he died in 1959. He and Esther lost three sons: two in infancy, and Franklyn Jr., killed in action in 1942.", "notable": ["Emigrated from England to the United States; year, ship and naturalization not yet found.", "Member trees attach him to the 1920, 1930 and 1940 U.S. censuses, which should show his occupation and address. (Lead)"], "military": "None found yet. He was 31 when World War I draft registration began in 1917, so a draft card should exist. A Frank Taylor of Spokane who died in Army service in October 1918 is a different man. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.hvr0x0gh32f6", "folder": "https://drive.google.com/drive/folders/1wkUVjM2SKrYqB8cvfnYoBXTUzBnpTAo-", "svc": [{"w": "ww1", "s": "possible", "n": "Should have a WWI draft card (Washington or Idaho); not yet found."}]}, {"id": "A11", "ahn": 11, "name": "Esther Elvira Williams", "sex": "F", "b": 1894, "dd": 1978, "living": false, "rel": "Great-grandmother", "line": "Taylor", "f": "A22", "m": "A23", "sp": ["A10"], "summary": "Wife of Franklyn Seymour Taylor; mother of 13. Born 9 April 1894 in Idaho (Find a Grave). Died in Spokane on 18 October 1978, aged 84; her death record gives her mother's maiden name as Smith. (Confirmed; Washington State Archives)"}, {"id": "A12", "ahn": 12, "name": "Joseph Valentine Lyon", "sex": "M", "b": 1895, "dd": 1971, "living": false, "rel": "Great-grandfather", "line": "Lyon", "f": "A24", "m": "A25", "sp": ["A13"], "role": "Ross's father.", "facts": ["Born 1895; died 1971 according to the fan chart. Find a Grave lists him as 1895–1970, so the death year needs checking. (Likely)", "Parents: David Ross Lyon and Mary Cairns. (Confirmed; Find a Grave family links, matching Ross's line)", "Wife: Constance Marie Svendsen (1896–1980), named as Constance M. Swenson in Ross's death notice. Sons: Ross Edgar and Jack. (Confirmed; Deseret News death notice)", "Married Constance M. Swenson in July 1918; he was then living in Bingham. Later of 1941 Tenth East, Salt Lake City (1942, 1952). (Confirmed; Salt Lake Tribune)"], "summary": "Joseph was the fifth of ten children born in Salt Lake City to the printer David Ross Lyon and Mary Cairns. His brothers included David Cairns Lyon, a missionary to the Netherlands in 1909 to 1912, and T. Edgar Lyon (1903–1978), who presided over the Netherlands Mission and became a well-known Latter-day Saint historian and president of the Mormon History Association. Joseph married Constance Svendsen, and they raised at least two sons, Ross and Jack, in the Salt Lake area. Little else about his own life has been found yet.", "notable": ["Siblings: David Cairns (1887–1971), John McArthur (1888–1907), Paul Cairns (1891–1974), Carol Holland Lyon Ash (1892–1978), Alan Ross (1898–1912), Kyle Arden (1900–1973), T. Edgar (1903–1978), Phillip (1905–1905) and Janette Lyon Ermisch (1908–1994). (Likely)", "A brother named John McArthur Lyon shows that the family kept the McArthur name alive, which fits the family's MacArthur story. (See Research on Famous Relatives)", "Constance's family came from Asker, Norway, and emigrated to Utah in 1909. (Confirmed; Salt Lake Tribune, 19 December 1943)"], "military": "None found. Searched 11 October 2026: no Utah WWI service questionnaire, and not in the searchable pages of Utah's WWI draft registers. In mid-1918 he was a civilian in Bingham. His FamilySearch draft card still needs a signed-in search.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.n2827j3dwy8y", "folder": "https://drive.google.com/drive/folders/1LTHKAHsz6I_ZAmjEvmna6gvTqBFwZP2k", "svc": [{"w": "ww1", "s": "possible", "n": "Searched 11 Oct 2026: no Utah questionnaire or draft register entry; draft card not yet checked."}]}, {"id": "A13", "ahn": 13, "name": "Constance Marie Svendsen", "sex": "F", "b": 1896, "dd": 1980, "living": false, "rel": "Great-grandmother", "line": "Lyon", "f": "A26", "m": "A27", "sp": ["A12"], "summary": "Ross's 1998 death notice spells her maiden name 'Swenson'. Daughter of John and Louise Swensen of Asker, Norway, who emigrated to Utah in 1909; she married Joseph V. Lyon in July 1918. (Confirmed; Salt Lake Tribune, 1918 and 1943)", "svc": [{"w": "ch_gather", "s": "lead", "n": "Probably came from Norway with her parents in 1909; birthplace not yet confirmed."}]}, {"id": "A14", "ahn": 14, "name": "Paul Platt", "sex": "M", "b": 1891, "dd": 1938, "living": false, "rel": "Great-grandfather", "line": "Platt", "f": "A28", "m": "A29", "sp": ["A15"], "role": "Father of Marjorie Anne Platt.", "facts": ["Born 30 January 1891, Salt Lake City, Utah. Died 14 April 1938, age 47.", "Parents: Franklin Benjamin Platt and Carrie Cornelia Harmon.", "Spouse: Edith Williams, married by June 1917. Children: David, Paul Jr., Daniel, Franklin, Marjorie Anne (1925–2014) and Cornelia May. (Confirmed; Magna Times, 22 April 1938)"], "summary": "Paul grew up in Salt Lake City in a family active in the city's 13th Ward. At 20 he was called to the Swiss and German Mission, where he served from 1911 until early 1914. He married Edith Williams by 1917, and they raised six children, including Marjorie, born in 1925. For many years he was assistant cashier of the First Security bank in Magna, and later he became a director and associate manager of the White Chapel Mortuary in Salt Lake City. He died in a Salt Lake hospital on 14 April 1938, at 47, after an operation, leaving Edith with six children, and was buried in the Salt Lake City Cemetery.", "notable": ["Baptized 4 March 1899 at age 8. (Confirmed)", "Set apart 25 July 1911 by Apostle Francis M. Lyman as a missionary to the Swiss and German Mission. (Confirmed)", "Sailed home from Liverpool to Saint John, New Brunswick, on 18 March 1914, age 22, listed as returning from the South German mission. (Confirmed)", "Brothers: Francis Harmon Platt (1886–1962, Netherlands mission), Norton Platt (1892–1981, Eastern States mission), and Edward Orson Platt (1895–1976, Central States mission and Tabernacle Choir). (Confirmed)", "Banking: assistant cashier for many years at the First Security bank in Magna. (Confirmed)", "Business: director and associate manager of the White Chapel Mortuary, Inc., Salt Lake City. (Confirmed)", "Died after an operation; the newspaper death list gives a brain tumor. (Likely)"], "military": "None found. Searched 11 October 2026: no Utah WWI service questionnaire, and not in the searchable pages of Utah's WWI draft registers; his 1938 obituaries mention no military service. His FamilySearch draft card still needs a signed-in search.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.4d3ltfj6rvpq", "folder": "https://drive.google.com/drive/folders/1p233XatkRrA6_BzyVZGzBExY_C11IYLE", "svc": [{"w": "ww1", "s": "possible", "n": "Searched 11 Oct 2026: no Utah questionnaire or draft register entry; draft card not yet checked."}, {"w": "ch_mission", "s": "confirmed", "n": "Swiss and German Mission, 1911–14."}, {"w": "ch_leader", "s": "confirmed", "n": "Member of the Twelfth-Thirteenth Ward seventies quorum."}]}, {"id": "A15", "ahn": 15, "name": "Edith Williams", "sex": "F", "b": 1894, "dd": 1965, "living": false, "rel": "Great-grandmother", "line": "Platt", "f": "A30", "m": "A31", "sp": ["A14"], "summary": "Great-grandmother. Daughter of David Joseph Williams and Martha Ann John. She married Paul Platt and was widowed in 1938. Public records found so far say little else about her.", "notable": ["Wanted: marriage date, 1940 and 1950 census entries, obituary, and family memories."]}, {"id": "A16", "ahn": 16, "name": "Jorgen Christian Johansen", "sex": "M", "b": 1860, "dd": null, "living": false, "rel": "2nd great-grandfather", "line": "Johnson", "f": "A32", "m": "A33", "sp": ["A17"]}, {"id": "A17", "ahn": 17, "name": "Ane Elisabeth Christiansen", "sex": "F", "b": 1862, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Johnson", "f": "A34", "m": "A35", "sp": ["A16"]}, {"id": "A18", "ahn": 18, "name": "Peter Martin Thomsen", "sex": "M", "b": 1863, "dd": 1926, "living": false, "rel": "2nd great-grandfather", "line": "Johnson", "f": "A36", "m": "A37", "sp": ["A19"]}, {"id": "A19", "ahn": 19, "name": "Hilma Albertine Johansen Olafsson", "sex": "F", "b": 1859, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Johnson", "f": "A38", "m": "A39", "sp": ["A18"]}, {"id": "A20", "ahn": 20, "name": "Robert Walling", "sex": "M", "b": null, "dd": null, "living": false, "rel": "2nd great-grandfather", "line": "Taylor", "f": null, "m": null, "sp": ["A21"], "summary": "No supporting record found for Robert Walling as Franklyn Taylor's father"}, {"id": "A21", "ahn": 21, "name": "Caroline Frances Gambier", "sex": "F", "b": 1861, "dd": null, "living": false, "rel": "2nd great-grandmother", "line": "Taylor", "f": "A42", "m": "A43", "sp": ["A20"], "role": "Mother of Franklyn Seymour Taylor. The fan chart spells her middle name Francis; her mother was Elizabeth Frances.", "facts": ["Born 18 May 1861, Woodford, Essex, England. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: William Gambier and Elizabeth Frances Edwards.", "Sons: Franklyn Seymour Taylor (born 1886, Alresford, Hampshire) and William Saunders (born 1901, Ellisfield, Hampshire). (Lead; Ancestry member tree, not yet checked against an original record)"], "summary": "Caroline was one of about 11 children of William Gambier and Elizabeth Frances Edwards, a family that lived in south London and later Watford. Her son Franklyn was born at Alresford, Hampshire, in 1886; her brother William George Gambier later died in Alresford. One family tree says she married William Saunders and had a second son in 1901, and another names Robert Walling as Franklyn's father. Nothing found so far suggests she left England.", "notable": ["Gambier is a Huguenot (French Protestant refugee) surname, found mainly in France and England. (Confirmed)", "One member tree gives her death as 1930. (Lead)"], "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.8a83b3gvu80a", "folder": "https://drive.google.com/drive/folders/1bYHGFl_qgy2aF554zqPSC-yJn3OvU3CB"}, {"id": "A22", "ahn": 22, "name": "Marion Warden Williams", "sex": "M", "b": 1853, "dd": 1925, "living": false, "rel": "2nd great-grandfather", "line": "Taylor", "f": "A44", "m": "A45", "sp": ["A23"], "summary": "Find a Grave gives 1857–1925 (the tree has 1853).", "svc": [{"w": "spam", "s": "possible", "n": "Aged 45–45 during the war; no record found yet."}]}, {"id": "A23", "ahn": 23, "name": "Martha Belle Smith", "sex": "F", "b": 1856, "dd": 1938, "living": false, "rel": "2nd great-grandmother", "line": "Taylor", "f": "A46", "m": "A47", "sp": ["A22"], "summary": "Find a Grave gives 1859–1938 (the tree has 1856)."}, {"id": "A24", "ahn": 24, "name": "David Ross Lyon", "sex": "M", "b": 1864, "dd": 1940, "living": false, "rel": "2nd great-grandfather", "line": "Lyon", "f": "A48", "m": "A49", "sp": ["A25"], "role": "Joseph's father.", "facts": ["Born 16 August 1864, Salt Lake City, the fourth of seven children of John Lyon and Caroline Holland. (Confirmed; BYU biography of John Lyon)", "Died 1940; funeral reported in the Bingham Bulletin of 14 June 1940. (Likely; newspaper index)", "Wife: Mary Cairns (1866–1948). Ten children, born 1887 to 1908. (Confirmed; Find a Grave family links and Church History Biographical Database)"], "summary": "David was born in Salt Lake City to the Scottish poet John Lyon and his second wife, Caroline Holland. At about twelve his father apprenticed him to a printer at the Salt Lake Herald, and he is listed as an apprentice printer in the 1880 census. He went on to run his own firm, the Magazine Printing Company, which printed the Church's magazines in the 1880s and 1890s; his son T. Edgar worked in the print shop from age nine. He served in the bishopric of Salt Lake's 20th Ward. In 1923 he kept a promise to his father by collecting John Lyon's poems and stories and publishing them as Songs of a Pioneer.", "notable": ["Business: owner of the Magazine Printing Company, Salt Lake City. (Confirmed)", "Church office: member of the 20th Ward bishopric. (Likely)", "Published his father's collected work, Songs of a Pioneer, in 1923. (Confirmed)", "BYU Special Collections has an authority record for him, and the Lyon family papers there may include his letters or business records. (Lead)"], "military": "None known. He was 52 in 1917, too old for most World War I service.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.v4n3pcjcsq7f", "folder": "https://drive.google.com/drive/folders/1nQfo7ZoCrhVf8olcQfDVh1D53QZjmkkR", "svc": [{"w": "spam", "s": "possible", "n": "Aged 34–34 during the war; no record found yet."}, {"w": "ch_leader", "s": "confirmed", "n": "20th Ward bishopric (Likely)."}, {"w": "ch_culture", "s": "confirmed", "n": "His Magazine Printing Company printed the Church's magazines; published his father's Songs of a Pioneer (1923)."}]}, {"id": "A25", "ahn": 25, "name": "Mary Ann Cairns", "sex": "F", "b": 1866, "dd": 1948, "living": false, "rel": "2nd great-grandmother", "line": "Lyon", "f": "A50", "m": "A51", "sp": ["A24"], "summary": "Ten children, 1887–1908. Daughter of Joseph McChesson Cairns and Janet Edgar Johnstone (FamilySearch tree, Lead), which resolves the earlier surname question."}, {"id": "A26", "ahn": 26, "name": "Johan Svendsen", "sex": "M", "b": 1854, "dd": 1930, "living": false, "rel": "2nd great-grandfather", "line": "Lyon", "f": "A52", "m": "A53", "sp": ["A27"], "summary": "Called John Swensen in Utah. Married Louise in Norway in 1877; emigrated from Asker, Norway, to Utah in 1909; died 1930. (Confirmed; Salt Lake Tribune, 19 December 1943)", "svc": [{"w": "ch_gather", "s": "confirmed", "n": "Came from Asker, Norway, to Utah with his family in 1909."}]}, {"id": "A27", "ahn": 27, "name": "Lovise Nicolene Andreassen", "sex": "F", "b": 1858, "dd": 1943, "living": false, "rel": "2nd great-grandmother", "line": "Lyon", "f": "A54", "m": "A55", "sp": ["A26"], "summary": "Louise Swensen Erickson. Her obituary gives her birth as 2 March 1858 in Asker, Norway. Joined the Church in 1895, came to Utah in 1909, married Niels C. Erickson in 1934, and died in Salt Lake City in December 1943, aged 85. (Confirmed; Salt Lake Tribune, 19 December 1943) FamilySearch now also gives 1858 and her full name, Lovise Nicolene Andreassen (Lead).", "svc": [{"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Norway in 1895; came to Utah in 1909."}, {"w": "ch_leader", "s": "lead", "n": "Her obituary suggests she led a Relief Society in Norway (scan garbled)."}]}, {"id": "A28", "ahn": 28, "name": "Franklin Benjamin Platt", "sex": "M", "b": 1856, "dd": 1928, "living": false, "rel": "2nd great-grandfather", "line": "Platt", "f": "A56", "m": "A57", "sp": ["A29"], "role": "Father of Paul Platt.", "facts": ["Born 13 October 1856, Salt Lake City. Died 14 March 1928, Salt Lake City, age 71.", "Parents: Francis Platt Jr. and Eliza Hester, English emigrants.", "Spouse: Carrie Cornelia Harmon, married 11 October 1883."], "summary": "Franklin was born in Salt Lake City four years after his father arrived from England, and lived there all his life. He married Carrie Cornelia Harmon in 1883. He served two church missions, the first to Mississippi in 1885 and the second to California from 1897 to 1899, where Carrie joined him at the end. His 1897 letter accepting the California call was written on the letterhead of the F. Platt Company, a harness and saddlery business on State Street.", "notable": ["Member of the 8th Quorum of Seventy (a church priesthood office). (Confirmed)", "Southern States Mission, Mississippi Conference, 13 October to 24 December 1885. Released early because his father died. (Confirmed)", "California Mission, 22 September 1897 to 11 October 1899; Carrie served with him from 1 September 1899. (Confirmed)", "His 1897 letter to Wilford Woodruff is on F. Platt Co. letterhead: harness and saddlery, 147 to 149 South State Street, Salt Lake City, established 1852. (Confirmed)", "That the F. Platt Company was founded by his father, Francis Platt Jr., who arrived in 1852, is a reasonable guess but not yet documented. (Lead)", "Sons who served missions: Francis Harmon, Paul, Norton and Edward Orson Platt. (Confirmed)"], "military": "None found. He was of militia age during the later years of the Black Hawk War (1865 to 1872); Utah territorial militia records have not been searched.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.ghdudxb53nsh", "folder": "https://drive.google.com/drive/folders/1j0aRoeVALrqkA77240EkPtUzaVAGoo0y", "svc": [{"w": "blackhawk", "s": "lead", "n": "Of militia age in the war's last years; Utah militia records not yet searched."}, {"w": "spam", "s": "possible", "n": "Aged 42–42 during the war; no record found yet."}, {"w": "ch_mission", "s": "confirmed", "n": "Southern States Mission (Mississippi), 1885; California Mission, 1897–99."}, {"w": "ch_leader", "s": "confirmed", "n": "Member of the 8th Quorum of Seventy."}]}, {"id": "A29", "ahn": 29, "name": "Carrie Cornelia Harmon", "sex": "F", "b": 1856, "dd": 1948, "living": false, "rel": "2nd great-grandmother", "line": "Platt", "f": "A58", "m": "A59", "sp": ["A28"], "role": "Mother of Paul Platt.", "facts": ["Born 5 March 1856, Pavilion, Genesee County, New York. Died 15 December 1948, Salt Lake City, age 92.", "Parents: Norton Harmon and Thankful Loretta Tanner.", "Spouse: Franklin Benjamin Platt, married 11 October 1883."], "summary": "Carrie was born in western New York and crossed the plains at age 7 with her parents in the 1863 Peter Nebeker Company. She married Franklin Benjamin Platt in Salt Lake City in 1883 and joined him in the California Mission in 1899. She outlived him by 20 years, and Salt Lake newspapers marked both her 91st birthday and her death, when one headline called her a pioneer and church aid worker.", "notable": ["Child pioneer: crossed the plains with the Peter Nebeker Company, 25 July to 25 September 1863. Some sources give 1862. (Confirmed)", "Baptized about 1864; rebaptized 7 June 1883, four months before her marriage. (Confirmed)", "Missionary companion to her husband in the California Mission, September to October 1899. (Confirmed)", "Newspaper items cited by the database: Salt Lake Telegram, 6 March 1947 (91st birthday); Deseret News and Salt Lake Tribune, 16 December 1948 (death and funeral). (Confirmed)"], "military": "Not applicable; none found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.gnienneziazu", "folder": "https://drive.google.com/drive/folders/1An5gRH_-H7PkiSfAG_85OLg4jnH3l_aB", "svc": [{"w": "ch_trail", "s": "confirmed", "n": "Child pioneer, aged 7: Peter Nebeker Company, July–September 1863."}, {"w": "ch_mission", "s": "confirmed", "n": "Served with her husband in the California Mission, 1899."}]}, {"id": "A30", "ahn": 30, "name": "David Joseph Williams", "sex": "M", "b": 1862, "dd": 1935, "living": false, "rel": "2nd great-grandfather", "line": "Platt", "f": "A60", "m": "A61", "sp": ["A31"], "role": "Father of Edith Williams.", "facts": ["Born 5 May 1862, Canton, Fulton County, Illinois. Died 28 November 1935, Salt Lake City.", "Parents: David Williams and Sarah Thomas, Welsh emigrants.", "Spouse: Martha Ann John, married 30 August 1883 in the Endowment House, Salt Lake City."], "summary": "David Joseph was born in Canton, Illinois, where his Welsh father mined coal. The family moved to Utah in 1877, and by 1880 his father was managing coal mines at Pleasant Valley (Winter Quarters) in Carbon County. David Joseph was living at Pleasant Valley when he married Martha Ann John, daughter of a prominent Provo church leader, in 1883.", "notable": ["Birth, parents, marriage and death dates as above. (Likely)", "Listed as a child of David Williams (1827–1889) on his father's memorial. (Confirmed)", "His father-in-law's journal records the 1883 wedding and calls him David J. Williams of Pleasant Valley. (Confirmed)"], "military": "None found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.mwuqz4v4001q", "folder": "https://drive.google.com/drive/folders/1Ie758ojRJgoPFs4nd_rRUn6VWlrkH1HF", "svc": [{"w": "spam", "s": "possible", "n": "Aged 36–36 during the war; no record found yet."}, {"w": "ch_gather", "s": "confirmed", "n": "Came to Utah from Canton, Illinois, in 1877 with the members his father brought west."}]}, {"id": "A31", "ahn": 31, "name": "Martha Ann John", "sex": "F", "b": 1864, "dd": 1927, "living": false, "rel": "2nd great-grandmother", "line": "Platt", "f": "A62", "m": "A63", "sp": ["A30"], "role": "Mother of Edith Williams.", "facts": ["Born 1864, probably in Provo, Utah. Died 1927.", "Parents: David John and Mary Wride, Welsh emigrants.", "Spouse: David Joseph Williams, married 30 August 1883."], "summary": "Martha Ann was one of nine children of David John and Mary Wride, born in Provo three years after her parents arrived from Wales. She married David Joseph Williams of Pleasant Valley in the Endowment House in Salt Lake City in 1883, followed by a reception in Provo. The Provo Territorial Enquirer described her as the daughter of a highly respected Provo resident.", "notable": ["Listed among the children of David John and Mary Wride. (Confirmed)", "Her 1883 wedding is recorded in her father's journal along with the newspaper notice. (Confirmed)"], "military": "Not applicable.", "tab": ["A36"], "summary": "Name and birth year from the FamilySearch tree (Lead)."}, {"id": "A38", "ahn": 38, "name": "Johannes Olafsson", "sex": "M", "b": 1821, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Johnson", "f": "A76", "m": "A77", "sp": ["A39"]}, {"id": "A39", "ahn": 39, "name": "Maja Stina Johansdotter", "sex": "F", "b": 1823, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Johnson", "f": "A78", "m": "A79", "sp": ["A38"], "summary": "Full name from the FamilySearch tree (Lead)."}, {"id": "A42", "ahn": 42, "name": "William Gambier", "sex": "M", "b": 1830, "dd": 1900, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": "A84", "m": "A85", "sp": ["A43"], "role": "Father of Caroline Frances Gambier.", "facts": ["Born 21 March 1830, Brixton, Surrey (now south London). Died October 1900, Watford, Hertfordshire. (Lead; Ancestry member tree, not yet checked against an original record)", "Wife: Elizabeth Frances Edwards. About 11 children, born 1854 to 1876, the first in Camberwell. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: the fan chart lists Thomas Gambier and Sarah Killingback; one member tree gives Thomas Gambier (1783–1848) and Ann Bolton instead."], "summary": "William was born in Brixton, south of London, in 1830, and married Elizabeth Frances Edwards, also from Brixton, around 1853. They raised a large family in the Camberwell area and later Watford, appearing in the English censuses of 1871, 1881 and 1891. He died in Watford in 1900.", "military": "None found. Two of his children were named Thomas Inkerman (1857) and Beatrice Alma (1859), after Crimean War battles of 1854. That could mean he served in the Crimea, or simply reflect patriotic naming at the time. (Lead)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.pfvlpigbzg49", "folder": "https://drive.google.com/drive/folders/1MGAjIR6EBhY6sBUZn6_hQ6KH8r3A3RPc", "svc": [{"w": "crimea", "s": "lead", "n": "Two children were named after 1854 Crimean War battles (Inkerman, Alma)."}]}, {"id": "A43", "ahn": 43, "name": "Elizabeth Frances Edwards", "sex": "F", "b": 1833, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": "A86", "m": null, "sp": ["A42"], "role": "Mother of Caroline Frances Gambier.", "facts": ["Born 3 February 1832, Brixton, Surrey. Died 30 May 1907, Watford, Hertfordshire. (Lead; Ancestry member tree, not yet checked against an original record)", "Parents: William Edwards (born 1802) and Ruth Rosanna Williams (1796–1870). Her father's name matches the fan chart. (Lead; Ancestry member tree, not yet checked against an original record)", "Husband: William Gambier, married about 1853."], "summary": "Elizabeth was born in Brixton in 1832, married William Gambier, and raised about 11 children in south London and Watford. She outlived him by seven years and died in Watford in 1907.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.l1ljsiy0qch4", "folder": "https://drive.google.com/drive/folders/1f6VlnLsKca78jKKg24XjMRb-M6pp6NI-"}, {"id": "A44", "ahn": 44, "name": "David Dora Willi…", "sex": "M", "b": 1823, "dd": 1870, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": null, "m": null, "sp": ["A45"], "summary": "Name truncated (likely Williams); 'Dora' as a middle name is unusual — verify", "svc": [{"w": "mex", "s": "possible", "n": "Aged 23–25 during the war; no record found yet."}, {"w": "civil", "s": "possible", "n": "Aged 38–42 during the war; no record found yet."}]}, {"id": "A45", "ahn": 45, "name": "Nancy Emaline G…", "sex": "F", "b": 1832, "dd": 1879, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": "A90", "m": "A91", "sp": ["A44"], "summary": "Name truncated; her listed father is surnamed Green"}, {"id": "A46", "ahn": 46, "name": "Peter Nicholas S…", "sex": "M", "b": 1801, "dd": 1870, "living": false, "rel": "3rd great-grandfather", "line": "Taylor", "f": "A92", "m": "A93", "sp": ["A47"], "summary": "Name truncated; likely Smith (father listed as Nicholas Titus Sm…)", "svc": [{"w": "mex", "s": "possible", "n": "Aged 45–47 during the war; no record found yet."}]}, {"id": "A47", "ahn": 47, "name": "Sarah E. Lauray", "sex": "F", "b": 1818, "dd": 1922, "living": false, "rel": "3rd great-grandmother", "line": "Taylor", "f": null, "m": null, "sp": ["A46"], "summary": "Dates imply age ~104 — verify; also check birth year vs. daughter born 1856"}, {"id": "A48", "ahn": 48, "name": "John Lyon", "sex": "M", "b": 1803, "dd": 1889, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A96", "m": "A97", "sp": ["A49"], "role": "David Ross Lyon's father. Scottish poet and Latter-day Saint pioneer.", "facts": ["Born 4 March 1803, Glasgow, Scotland. Died 28 November 1889, Salt Lake City. (Confirmed; Church History Biographical Database, BYU biography)", "Parents: Thomas Lyon (about 1758–1811) and Janet McArthur (born about 1777, Pollokshaws). (Confirmed; BYU biography)", "Wives: Janet Thomson, married 23 February 1826 in Kilmarnock; Caroline Holland, married 28 March 1856 in the Endowment House. Twelve children with Janet, seven of whom lived to adulthood, and seven with Caroline. (Confirmed; Church History Biographical Database, BYU biography)"], "summary": "John grew up poor in Glasgow. His father, a soldier turned military hospital assistant and brewery clerk, died when John was eight, and John went to work as a weaver's apprentice and cotton spinner. He became a hand-loom weaver in Kilmarnock, where he married and began writing for Scottish newspapers. He joined the Church in 1844, led the Kilmarnock branch, served as a missionary and conference president in Worcestershire, and then presided over the Glasgow Conference. In 1853 he published The Harp of Zion, giving the proceeds to the Perpetual Emigrating Fund, and that same year led the 'Ten Pound Saints' aboard the International to New Orleans and crossed the plains with the Jacob Gates Company. In Salt Lake City he worked as a weaver and carpenter, ran the Endowment House for about thirty years, served as territorial librarian, led the 37th Quorum of Seventy, and was ordained a patriarch in 1872. He was also the drama critic at the Salt Lake Theatre and taught the young Maude Adams. Many called him Father Lyon.", "notable": ["Migration: Glasgow to Liverpool by the steamer Princess Royal, then the ship International to New Orleans (arrived 23 April 1853), up the Mississippi to Keokuk, Iowa, and overland with the Jacob Gates Company, reaching Salt Lake on 30 September 1853. (Confirmed)", "Public office: territorial librarian of Utah; not reappointed in 1876 after a dispute over library access. (Confirmed)", "Superintendent of the Endowment House, about 1855 to 1885. (Confirmed)", "Business: home weaving shop with a loom he built; Brigham Young paid him to teach his daughters to weave. His son Thomas ran Lyon's Weaving Factory in the 20th Ward until 1863. (Confirmed)", "Writer: The Harp of Zion (1853); Songs of a Pioneer (1923, published by his son David). (Confirmed)", "Plural marriage to sixteen-year-old Caroline Holland in 1856, when he was 53. (Confirmed)"], "military": "Utah War, 1857–58: one of about 300 men chosen to stay in Salt Lake County, ready to burn the buildings if the U.S. Army attacked. He also packed up the Endowment House records and moved them to Provo. (Confirmed) His father, Thomas Lyon, joined the army in his thirties and later served as a military surgeon's assistant. (Confirmed)", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.rh0z8ofgwkj0", "folder": "https://drive.google.com/drive/folders/18h9B612QLT_BXyA6ItlHUpsbV2mPuQoA", "svc": [{"w": "utah", "s": "confirmed", "n": "One of about 300 men kept in Salt Lake County, ready to burn the city, 1857–58."}, {"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Scotland in 1844; led the \"Ten Pound Saints\" on the ship International, 1853."}, {"w": "ch_trail", "s": "confirmed", "n": "Jacob Gates Company, 1853."}, {"w": "ch_mission", "s": "confirmed", "n": "Missionary and conference president in Worcestershire and Glasgow before emigrating."}, {"w": "ch_leader", "s": "confirmed", "n": "Patriarch (1872) and president of the 37th Quorum of Seventy."}, {"w": "ch_temple", "s": "confirmed", "n": "Superintendent of the Endowment House, about 1855–85."}, {"w": "ch_culture", "s": "confirmed", "n": "Poet: The Harp of Zion (1853); drama critic at the Salt Lake Theatre."}, {"w": "ch_plural", "s": "confirmed", "n": "Married Caroline Holland as a plural wife in 1856."}]}, {"id": "A49", "ahn": 49, "name": "Caroline Holland", "sex": "F", "b": 1839, "dd": 1912, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A98", "m": "A99", "sp": ["A48"], "role": "David Ross Lyon's mother and John Lyon's second wife.", "facts": ["Born 29 June 1839, Barton under Needwood, Staffordshire, England. Died 2 May 1912, Holbrook, Oneida County, Idaho. (Confirmed; Church History Biographical Database)", "Parents: William Holland and Sarah Tomlinson, both of whom died on the way west, at Nauvoo and Winter Quarters. (Confirmed; BYU biography and Church History Biographical Database)", "Married John Lyon, 28 March 1856, Endowment House, Salt Lake City. Seven children, 1857 to 1872, all of whom survived infancy. (Confirmed; BYU biography)"], "summary": "Caroline was born in Staffordshire and came to America with Latter-day Saint parents who both died on the trail, at Nauvoo and Winter Quarters. Orphaned, she worked as a maid for the Robert Crookston family, who brought her to Salt Lake City with the Betz Company in 1852, when she was about thirteen; she was baptized that October. At sixteen she became the plural wife of the 53-year-old John Lyon. She raised seven children, including David Ross Lyon, outlived John by more than twenty years, and died in Holbrook, Idaho, in 1912.", "notable": ["Migration: England to Nauvoo and Winter Quarters as a child; Salt Lake City in 1852 with the Betz Company; later Holbrook, Idaho. (Confirmed)", "Children: Joseph Young (1857), Sarah Elizabeth (1859), William Augustus (1861), David Ross (1864), Alexander (1866), James (1869) and Eliza Snow (1872). (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.pqss1apeeink", "folder": "https://drive.google.com/drive/folders/14z8TyvaD0wfRMvcWKhdz_kus6l0d7G9k", "svc": [{"w": "ch_gather", "s": "confirmed", "n": "Came from Staffordshire as a child with Latter-day Saint parents."}, {"w": "ch_early", "s": "confirmed", "n": "Her parents died on the way west, at Nauvoo and Winter Quarters."}, {"w": "ch_trail", "s": "confirmed", "n": "Orphaned; came west with the Robert Crookston family in the Betz Company, 1852."}, {"w": "ch_plural", "s": "confirmed", "n": "Plural wife of John Lyon from 1856, at sixteen."}, {"w": "ch_settle", "s": "lead", "n": "Spent her last years in Holbrook, Oneida County, Idaho."}]}, {"id": "A50", "ahn": 50, "name": "Joseph McChesson Cairns", "sex": "M", "b": 1839, "dd": 1895, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A100", "m": "A101", "sp": ["A51"], "summary": "Full name from the FamilySearch tree (Lead): McChesson is a middle name, so his surname matches his daughter's and his parents' (Cairns).", "svc": [{"w": "blackhawk", "s": "possible", "n": "Aged 26–33 during the war; no record found yet."}]}, {"id": "A51", "ahn": 51, "name": "Janet Edgar Johnstone", "sex": "F", "b": 1842, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A102", "m": "A103", "sp": ["A50"], "summary": "Full name from the FamilySearch tree (Lead)."}, {"id": "A52", "ahn": 52, "name": "Sven Andreasson", "sex": "M", "b": 1820, "dd": 1907, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A104", "m": "A105", "sp": ["A53"]}, {"id": "A53", "ahn": 53, "name": "Maja Jonasdotter", "sex": "F", "b": 1827, "dd": 1907, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A106", "m": "A107", "sp": ["A52"], "summary": "Name and death year from the FamilySearch tree (Lead)."}, {"id": "A54", "ahn": 54, "name": "Andreas Johannesen", "sex": "M", "b": 1793, "dd": null, "living": false, "rel": "3rd great-grandfather", "line": "Lyon", "f": "A108", "m": "A109", "sp": ["A55"], "summary": "The FamilySearch tree now gives Andreas Johannesen, born 1793, death year not given (it earlier read Andreas Johansen, 1822–1897). A 1793 birth would make him about 65 when Lovise was born in 1858, so one of these is probably wrong (Uncertain)."}, {"id": "A55", "ahn": 55, "name": "Karen Marie Nilsen", "sex": "F", "b": 1823, "dd": null, "living": false, "rel": "3rd great-grandmother", "line": "Lyon", "f": "A110", "m": "A111", "sp": ["A54"]}, {"id": "A56", "ahn": 56, "name": "Francis Platt Jr.", "sex": "M", "b": 1824, "dd": 1885, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A112", "m": "A113", "sp": ["A57"], "role": "Grandfather of Paul Platt.", "facts": ["Born 14 March 1824, Darlaston, Staffordshire, England (some records say 1825). Died 14 December 1885, Salt Lake City.", "Parents: Francis Platt and Elizabeth Watson.", "Spouses: Mary Ann White (married 1849, died 1852 on the trail); Eliza Hester (married 19 November 1853)."], "summary": "Francis was born in Darlaston, an industrial town in the Black Country of Staffordshire, and joined the church there in 1850. In 1852 he emigrated with help from the Perpetual Emigrating Fund, the church's loan fund for poor emigrants, and crossed the plains with the Abraham O. Smoot Company. His wife Mary Ann died during the crossing. He remarried in Salt Lake City in 1853 and returned to England as a missionary in 1864. His journals from 1864 to 1868 are held by the Church History Library.", "notable": ["Baptized 20 March 1850 by Thomas Tame. (Confirmed)", "Crossed the plains with the Abraham O. Smoot Company, 1 June to 3 September 1852, with his wife and 2-year-old daughter Mary Elizabeth. Named in the 1852 Deseret News list of emigrants assisted by the Perpetual Emigrating Fund. (Confirmed)", "First wife Mary Ann White died 24 June 1852 during the crossing. (Confirmed)", "British Mission, set apart 22 April 1864 by Franklin D. Richards. (Confirmed)", "Journals, 1864 to 1868, held at the Church History Library as MS 14895. (Likely)", "Son Alonzo Watson Platt (1872–1946) sang bass in the Tabernacle Choir. (Confirmed)"], "military": "None found. Men his age in 1850s and 1860s Salt Lake City were normally enrolled in the territorial militia, but no record naming him has been found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.ozaoi81mlvw8", "folder": "https://drive.google.com/drive/folders/11iM3uo3iycA9msg89Qj4dIeFGcsEp8K-", "svc": [{"w": "utah", "s": "possible", "n": "Aged 33–34 during the war; no record found yet."}, {"w": "blackhawk", "s": "possible", "n": "Aged 41–48 during the war; no record found yet."}, {"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Darlaston, Staffordshire, in 1850; emigrated in 1852 with help from the Perpetual Emigrating Fund."}, {"w": "ch_trail", "s": "confirmed", "n": "Abraham O. Smoot Company, June–September 1852; his first wife, Mary Ann White, died on the trail."}, {"w": "ch_mission", "s": "confirmed", "n": "British Mission, set apart 22 April 1864."}]}, {"id": "A57", "ahn": 57, "name": "Eliza Hester", "sex": "F", "b": 1832, "dd": 1914, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A114", "m": "A115", "sp": ["A56"], "role": "Grandmother of Paul Platt.", "facts": ["Born 6 May 1832, probably England. Died 12 June 1914.", "Parents (from the fan chart): Edward Hester and Elizabeth Walling…", "Spouse: Francis Platt Jr., married 19 November 1853."], "summary": "Eliza crossed the plains with the Jacob Gates Company in 1853, arriving in Salt Lake City in late September. Two months later she married Francis Platt Jr., a widower whose first wife had died on the trail the year before. The family belonged to Salt Lake City's 13th Ward. She outlived Francis by nearly 29 years.", "notable": ["Crossed the plains with the Jacob Gates Company, 3 June to 26 September 1853. (Confirmed)", "Possible voyage: an \"Eliza Esther,\" age 20, from Watford, Hertfordshire, sailed alone on the ship International from Liverpool to New Orleans in February to April 1853. The age and year fit, but the spelling differs. (Lead)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.2srnon9dreai", "folder": "https://drive.google.com/drive/folders/1rijVtK5oCbq0B-7vjtw4hmasBQPu9zix", "svc": [{"w": "ch_gather", "s": "confirmed", "n": "Came from England in 1853. Her voyage may have been on the ship International (Lead)."}, {"w": "ch_trail", "s": "confirmed", "n": "Jacob Gates Company, June–September 1853."}]}, {"id": "A58", "ahn": 58, "name": "Norton Harmon", "sex": "M", "b": 1820, "dd": 1872, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A116", "m": "A117", "sp": ["A59"], "role": "Father of Carrie Cornelia Harmon.", "facts": ["Born 1 August 1820, Stafford, Genesee County, New York. Died 30 January 1872, Kaysville, Utah Territory, age 51.", "Parents (from the fan chart): Adonijah Harmon and Clementina Ama…", "Spouse: Thankful Loretta Tanner, married 4 January 1843."], "summary": "Norton was born in western New York and married Thankful Loretta Tanner in 1843. He was baptized about 1847 by Almon Babbitt, a prominent church agent of that period, but the family stayed in New York for another 16 years. In 1863 they crossed the plains with the Peter Nebeker Company and settled first at Coalville in Summit County. He died at Kaysville in Davis County in 1872.", "notable": ["Baptized about 1847 by Almon Babbitt. (Confirmed)", "Crossed the plains with the Peter Nebeker Company, 25 July to 25 September 1863. (Confirmed)", "The family first settled at Coalville, Summit County, according to a son's obituary. (Likely)", "Not the same person as Oliver Norton Harmon (1826–1901) of Pennsylvania, who sometimes turns up in searches. (Confirmed)"], "military": "None found.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.1drp7yopu8vd", "folder": "https://drive.google.com/drive/folders/1W84IcYnxaOU3Fv7qpxMD9WtH4NdR33nU", "svc": [{"w": "mex", "s": "possible", "n": "Aged 26–28 during the war; no record found yet."}, {"w": "utah", "s": "possible", "n": "Aged 37–38 during the war; no record found yet."}, {"w": "blackhawk", "s": "possible", "n": "Aged 45–52 during the war; no record found yet."}, {"w": "ch_trail", "s": "confirmed", "n": "Peter Nebeker Company, 1863, with his wife and children."}, {"w": "ch_settle", "s": "confirmed", "n": "The family first settled at Coalville, Summit County (Likely)."}]}, {"id": "A59", "ahn": 59, "name": "Thankful Loretta Tanner", "sex": "F", "b": 1824, "dd": 1891, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A118", "m": "A119", "sp": ["A58"], "role": "Mother of Carrie Cornelia Harmon.", "facts": ["Born 25 April 1824, Stafford, Genesee County, New York. Died 20 March 1891, Mesa, Arizona. (Likely; Find a Grave)", "Parents: William Tanner (1793–1839) and Hannah Mead (1793–1876). (Likely; Find a Grave and the fan chart)", "Spouse: Norton Harmon, married 4 January 1843."], "summary": "Thankful married Norton Harmon in New York in 1843 and came to Utah with him and their children in 1863, when she was 39. After Norton died in 1872 she moved to Mesa, Arizona, probably with some of her children, who took part in the Latter-day Saint settlement there. She is buried in the Mesa City Cemetery.", "notable": ["Buried in Mesa City Cemetery, Maricopa County, Arizona. (Confirmed)", "Crossed the plains with the Peter Nebeker Company in 1863. (Likely)", "Her parents' 1813 marriage appears in George C. Tanner's 1905 genealogy of the descendants of William Tanner of North Kingstown, Rhode Island, so her Tanner family goes back to colonial Rhode Island. This replaces an earlier note that she was not from that Tanner family. (Likely)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.7qjd8wb25k8h", "folder": "https://drive.google.com/drive/folders/1cJykpld09Dec564lJ-Kbs0LfOv_5-TVE", "svc": [{"w": "ch_trail", "s": "confirmed", "n": "Peter Nebeker Company, 1863 (Likely)."}, {"w": "ch_settle", "s": "confirmed", "n": "After 1872 moved to Mesa, Arizona, where her children helped settle the Latter-day Saint community; buried in Mesa (Likely)."}]}, {"id": "A60", "ahn": 60, "name": "David Williams", "sex": "M", "b": 1827, "dd": 1889, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A120", "m": "A121", "sp": ["A61"], "role": "Grandfather of Edith Williams.", "facts": ["Born 16 December 1827, Blaenavon, Monmouthshire, Wales. Died 6 December 1889, Price, Utah.", "Parents: David Williams and Sarah Rees.", "Spouses: Sarah Thomas (married 29 May 1847); Mary Ellen Watson Parmley (married 1885, plural marriage). 14 children."], "summary": "David joined the church in Wales in 1847 and emigrated with his wife and three young children in 1854. He settled in Canton, Illinois, where he mined coal, bought coal land, and later led the local church branch. After losing his wealth around 1876 he still paid to move about twenty Canton members to Utah, arriving in 1877. He became contractor and manager of the Denver and Rio Grande Western coal mines at Pleasant Valley, was the area's first bishop, served a mission to Wales from 1885 to 1888, and opened a store in Price shortly before he died.", "notable": ["Sailed on the Clara Wheeler from Liverpool, 27 November 1854, to New Orleans, 12 January 1855, with wife Sarah and children Adneby, Claudia and Dan. Measles killed 23 passengers on the voyage. (Confirmed)", "Coal miner and coal land owner in Canton, Illinois, from 1856; president of the Canton branch of about 50 members. (Confirmed)", "Arrived in Ogden 5 August 1877; ran a small coal business in Salt Lake City; Southern States mission in 1878. (Confirmed)", "From 1880, contractor and manager of the Pleasant Valley coal mines; first bishop of the Pleasant Valley Ward, 1883 to 1885. (Confirmed)", "In 1883, as leaseholder of the Winter Quarters mine, he protested a rival company's reopening of the nearby Utah Mine. (Likely)", "Plural marriage to Mary Ellen Watson Parmley in 1885, during the federal anti-polygamy campaign. No prosecution found. (Confirmed)"], "military": "None found. He was in Illinois during the Civil War, but no service record has turned up.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.rv6zacjtfh9o", "folder": "https://drive.google.com/drive/folders/1IjgiIuD3ZScX8_u0MinkigvKtZcxJQNh", "svc": [{"w": "civil", "s": "possible", "n": "In Illinois during the war; no service record found yet."}, {"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Wales in 1847; sailed on the Clara Wheeler, 1854–55; brought about twenty Canton, Illinois, members to Utah in 1877."}, {"w": "ch_mission", "s": "confirmed", "n": "Southern States Mission, 1878; mission to Wales presiding over the Welsh conference, 1885–88."}, {"w": "ch_leader", "s": "confirmed", "n": "First bishop of the Pleasant Valley Ward, 1883–85."}, {"w": "ch_settle", "s": "confirmed", "n": "Helped build the Pleasant Valley coal camp (Winter Quarters) in Carbon County; opened a store in Price, 1889."}, {"w": "ch_plural", "s": "confirmed", "n": "Married Mary Ellen Watson Parmley as a plural wife in 1885."}]}, {"id": "A61", "ahn": 61, "name": "Sarah Thomas Williams", "sex": "F", "b": 1827, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A122", "m": "A123", "sp": ["A60"], "role": "Grandmother of Edith Williams.", "facts": ["Born 1827, Wales. Died 1905.", "Parents (from the fan chart): Daniel Thomas J… and Sarah Thomas Bo…", "Spouse: David Williams, married 29 May 1847."], "summary": "Sarah married David Williams in Monmouthshire in 1847 and emigrated with him and three small children on the Clara Wheeler in 1854, a voyage on which measles killed 23 people. She lived through the Canton, Illinois years and the move to Utah in 1877. Her husband took a plural wife in 1885, and she outlived him by 16 years.", "notable": ["Listed on the Clara Wheeler passenger list, age 27, 1854. (Confirmed)", "Recorded as Sarah Thomas Williams (1827–1905), wife of David Williams. (Confirmed)", "Not the same person as Sarah Thomas Williams (1834–1909) of Spanish Fork. (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.exscj17c5h6u", "folder": "https://drive.google.com/drive/folders/1s6FbF2RUaSholwsMzRFST_6GFuVdiMlA", "svc": [{"w": "ch_gather", "s": "confirmed", "n": "Emigrated from Wales with her husband and three children on the Clara Wheeler, 1854; 23 passengers died of measles."}, {"w": "ch_plural", "s": "confirmed", "n": "First wife in a plural family after 1885."}]}, {"id": "A62", "ahn": 62, "name": "David John", "sex": "M", "b": 1833, "dd": 1908, "living": false, "rel": "3rd great-grandfather", "line": "Platt", "f": "A124", "m": "A125", "sp": ["A63"], "role": "Grandfather of Edith Williams.", "facts": ["Born 29 January 1833, Little Newcastle, Pembrokeshire, Wales. Died 24 December 1908, Provo, Utah. Buried Provo City Cemetery.", "Parents: Daniel John and Mary Williams.", "Spouses: Mary Wride (married 8 February 1860, Cardiff); Jane Cree (married 8 October 1865, plural marriage). 20 children."], "summary": "David was raised Baptist and trained for the Baptist ministry before joining the Latter-day Saints in 1856. He served as a missionary in Wales and England, emigrated in 1861, and settled in Provo, where for nearly 50 years he was one of the leading figures in church, school and business life. He was a partner of Abraham O. Smoot, served as Utah Stake president, sat on the board of Brigham Young Academy and BYU, and was imprisoned in 1887 for polygamy. His diaries are considered among the best kept by any Welsh convert.", "notable": ["Baptized 6 February 1856; missionary in Wales, 1856 to 1860, later presiding over the Flintshire Conference and other districts. (Confirmed)", "Sailed on the Manchester from Liverpool, 16 April 1861, arriving New York 14 May; crossed the plains with the Homer Duncan Company, arriving 13 September 1861. (Confirmed)", "His daughter Annie Jane, about 8 months old, died on the trail near Devil's Gate, Wyoming, on 20 August 1861. (Confirmed)", "Second mission to Wales, 1871 to 1873. (Confirmed)", "Church offices: Provo 3rd Ward bishopric counselor from 1862; stake Sunday School superintendent 1865 to 1893; Utah Stake presidency counselor 1877 to 1901; Utah Stake president 1901 to 1908. (Confirmed)", "Ordained a bishop in 1883 and made the Presiding Bishop's agent for Utah County. (Confirmed)"], "military": "None found. Provo men were often called up during the Black Hawk War (1865 to 1872); Utah militia indexes have not been searched.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.876dhx2hmwzp", "folder": "https://drive.google.com/drive/folders/12kdvljUMW9PNZcbNIIWLCuIZI10Fq4Ij", "svc": [{"w": "blackhawk", "s": "lead", "n": "Provo men were often called up; Utah militia indexes not yet searched."}, {"w": "ch_gather", "s": "confirmed", "n": "Joined the Church in Wales in 1856; sailed on the Manchester, 1861."}, {"w": "ch_trail", "s": "confirmed", "n": "Homer Duncan Company, 1861."}, {"w": "ch_mission", "s": "confirmed", "n": "Missionary in Wales and England, 1856–60; second mission to Wales, 1871–73."}, {"w": "ch_leader", "s": "confirmed", "n": "Bishop; Utah Stake presidency counselor 1877–1901 and Utah Stake president 1901–08."}, {"w": "ch_plural", "s": "confirmed", "n": "Married Jane Cree as a plural wife in 1865; imprisoned in 1887 under the Edmunds Act."}]}, {"id": "A63", "ahn": 63, "name": "Mary Wride", "sex": "F", "b": 1831, "dd": 1905, "living": false, "rel": "3rd great-grandmother", "line": "Platt", "f": "A126", "m": "A127", "sp": ["A62"], "role": "Grandmother of Edith Williams.", "facts": ["Born December 1831, Llantrisant, Glamorgan, Wales (sources differ on the day). Died 14 December 1905, Provo, Utah.", "Parents: Danson Wride and Ann Davies.", "Spouse: David John, married 8 February 1860, Cardiff."], "summary": "Mary joined the church in 1857, married David John in Cardiff in 1860, and emigrated with him in 1861. Her baby daughter Annie died on the trail in Wyoming. In Provo she raised nine children and became one of the leading women in Utah County: president of the Utah Stake Relief Society for more than 20 years and an organizer in the Utah County women's suffrage movement.", "notable": ["Censuses place her in Llantrisant (1841), Whitchurch, Glamorgan (1851, 1861), and Provo (1870, 1880, 1900). (Confirmed)", "Emigrated on the Manchester in 1861 and crossed the plains with the Homer Duncan Company; daughter Annie died 20 August 1861. (Confirmed)", "Utah Stake Relief Society president, 1884 to 1905. (Confirmed)", "Active in the Utah County Woman Suffrage Association; Provo agent for the Woman's Exponent newspaper; corresponded with Emmeline B. Wells. (Confirmed)", "Her brother Barry Wride kept a journal of the 1861 voyage. (Confirmed)"], "military": "Not applicable.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.v6na002o4u20" "4th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A116"], "summary": "Name truncated"}, {"id": "A118", "ahn": 118, "name": "William Tanner", "sex": "M", "b": 1793, "dd": 1839, "living": false, "rel": "4th great-grandfather", "line": "Platt", "f": "A236", "m": "A237", "sp": ["A119"], "role": "Father of Thankful Loretta Tanner.", "facts": ["Born 30 April 1793, son of Benjamin Tanner and Thankful Stafford of Greenfield, Saratoga County, New York. (Likely; Tanner genealogy, 1905)", "Married Hannah Mead (born 7 May 1793, Greenfield, New York; died 1876) on 20 November 1813. (Likely; Tanner genealogy, page 44, and Find a Grave)", "Died 1839. (Likely; Find a Grave family links)"], "summary": "William grew up in Greenfield, near Ballston Springs in Saratoga County, where his father Benjamin had settled after leaving Rhode Island. He married Hannah Mead, a Greenfield girl born the same year as he was, in 1813. By the 1820s the family was in Stafford, Genesee County, in western New York, where his brother Rowland Tanner also lived and where his daughter Thankful Loretta was born in 1824. He died in 1839, aged about 46. Hannah lived until 1876.", "notable": ["Migration: Saratoga County to Stafford, Genesee County, New York, part of the westward move into the newly opened Genesee country after the War of 1812. His brother Rowland made the same move and later went on to Michigan. (Likely)", "His daughter's name, Thankful, matches his mother, Thankful Stafford, and his aunt Thankful Tanner (born 1757). (Likely)", "He is the link to the colonial Tanners of Rhode Island: William Tanner of North Kingstown (born about 1660), then William (born 1712, North Kingstown), then Benjamin (born Exeter, Rhode Island), then William (born 1793). (Likely)"], "military": "None found yet. He was 19 when the War of 1812 began, and New York militia were called out repeatedly during the war, so service is possible. Next search: War of 1812 service and pension indexes for a William Tanner of Saratoga or Genesee County.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.uod25rmatn4l", "folder": "https://drive.google.com/drive/folders/1QzbxVIN8cDovQVVCmUpNxEpJ6_YAEeb3", "svc": [{"w": "w1812", "s": "lead", "n": "Age 19 in 1812; New York militia were called out repeatedly."}]}, {"id": "A119", "ahn": 119, "name": "Hannah Mead", "sex": "F", "b": 1793, "dd": 1876, "living": false, "rel": "4th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A118"], "summary": "Hannah Mead, born 7 May 1793, Greenfield, N.Y.; died 1876 (Find a Grave). Possible route for the family's Mayflower story."}, {"id": "A120", "ahn": 120, "name": "David Williams", "sex": "M", "b": null, "dd": null, "living": false, "rel": "4th great-grandfather", "line": "Platt", "f": null, "m": null, "sp": ["A121"]}, {"id": "A121", "ahn": 121, "name": "Sarah Reese", "sex": "F", "b": null, "dd": null, "living": false, "rel": "4th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A120"]}, {"id": "A122", "ahn": 122, "name": "Daniel Thomas J…", "sex": "M", "b": null, "dd": null, "living": false, "rel": "4th great-grandfather", "line": "Platt", "f": null, "m": null, "sp": ["A123"], "summary": "Name truncated"}, {"id": "A123", "ahn": 123, "name": "Sarah Thomas Bo…", "sex": "F", "b": null, "dd": null, "living": false, "rel": "4th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A122"], "summary": "Name truncated"}, {"id": "A124", "ahn": 124, "name": "Daniel John", "sex": "M", "b": null, "dd": null, "living": false, "rel": "4th great-grandfather", "line": "Platt", "f": null, "m": null, "sp": ["A125"]}, {"id": "A125", "ahn": 125, "name": "Mary Williams", "sex": "F", "b": null, "dd": null, "living": false, "rel": "4th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A124"]}, {"id": "A126", "ahn": 126, "name": "Dawson Wride", "sex": "M", "b": null, "dd": null, "living": false, "rel": ": "Revolutionary War, 1780: served in Captain Joshua Drake's company in the regiment of Colonel John Harper, part of the New York state levies (Harper's and Malcom's Levies). (Likely) Next steps: check the New York State Archives' Revolutionary War accounts for Benjamin Tanner, the National Archives pension and bounty-land files, and the Daughters of the American Revolution ancestor database, which may already list him as a proven patriot.", "tab": "https://docs.google.com/document/d/1CVnIlvS106MjGA9HjT5ydYQTeIY-Rq546EknVCZ9Xv8/edit?tab=t.zgt8jq2yfx40", "folder": "https://drive.google.com/drive/folders/1w3yYayWDtzVD5zSVBGdFiuqMhyVWIoDP", "svc": [{"w": "rev", "s": "confirmed", "n": "1780, Capt. Joshua Drake's company, Harper's New York levies."}]}, {"id": "A237", "ahn": 237, "name": "Thankful Stafford", "sex": "F", "b": null, "dd": null, "living": false, "rel": "5th great-grandmother", "line": "Platt", "f": null, "m": null, "sp": ["A236"], "summary": "Wife of Benjamin Tanner (G. C. Tanner, 1905). Parents unknown; possibly of the Rowland Stafford family of R.I. (Lead). Added 2026-10-10, not on fan chart."}, {"id": "X01", "ahn": null, "name": "Stephanie Ernst", "sex": "F", "b": 1967, "dd": null, "living": true, "rel": "Spouse", "line": "Ernst", "f": "X07", "m": "X08", "sp": ["A1"], "summary": ""}, {"id": "X02", "ahn": null, "name": "Graciela Vidales", "sex": "F", "b": 1974, "dd": 2019, "living": false, "rel": "Spouse", "line": "", "f": null, "m": null, "sp": ["A1"]}, {"id": "X03", "ahn": null, "name": "Madison Johnson", "sex": "F", "b": 1994, "dd": null, "living": true, "rel": "Daughter", "line": "Ernst", "f": "A1", "m": "X01", "sp": [], "summary": ""}, {"id": "X04", "ahn": null, "name": "Conner Johnson", "sex": "M", "b": 1995, "dd": null, "living": true, "rel": "Son", "line": "Ernst", "f": "A1", "m": "X01", "sp": [], "summary": ""}, {"id": "X05", "ahn": null, "name": "Seth Johnson", "sex": "M", "b": 2000, "dd": null, "living": true, "rel": "Son", "line": "Ernst", "f"
