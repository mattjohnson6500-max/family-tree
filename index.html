<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johnson Family Tree</title>
<noscript><meta http-equiv="refresh" content="0; url=family-tree-index.html"></noscript>
<style>body{font:16px system-ui,sans-serif;margin:2rem;background:#f3f5f7;color:#1c2530}a{color:#2f5d8a}</style>
<script>
// Always open the newest build: ask version.json (bypassing caches) and load that exact version.
(async function () {
  // keep any other parameters, e.g. ?start=X60 (who the tree starts from)
  const qs = new URLSearchParams(location.search);
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
    if (r.ok) { const v = (await r.json()).build; if (v) qs.set("v", v); }
  } catch (e) {}
  const s = qs.toString();
  location.replace("family-tree-index.html" + (s ? "?" + s : "") + location.hash);
})();
</script>
</head><body><p>Opening the <a href="family-tree-index.html">Johnson Family Tree</a>…</p></body></html>
